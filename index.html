  }
  save(); render(); if(ui.tab==='data') fillBackups();
}
function remapPlayer(t, from, to){ t.roster = t.roster.map(x=>x===from?to:x); t.teams.forEach(tm=>{ tm.members = tm.members.map(x=>x===from?to:x); if(tm.cap===from) tm.cap=to; });
  const k1 = 'p:'+from, k2 = 'p:'+to, sw = a => a && a.map(x=>x===k1?k2:x);
  t.stages.forEach(S=>{ S.entrants = sw(S.entrants); S.manualSeeds = sw(S.manualSeeds); S.locked = sw(S.locked); S.matches.forEach(m=>{ if(m.sides) m.sides = m.sides.map(s=>s&&sw(s)); (m.games||[]).forEach(g=>{ if(g.civs && g.civs[from]!=null){ g.civs[to]=g.civs[from]; delete g.civs[from]; } }); }); }); }
function exportView(){
  const t = T(), used = new Set(t.roster); t.teams.forEach(tm=>tm.members.forEach(x=>used.add(x)));
  const players = {}; used.forEach(id=>{ if(state.players[id]) players[id] = state.players[id]; });
  const data = {app:'tourney-tracker', v:1, players, porder:state.porder.filter(id=>players[id]), tours:[t], cur:t.id, exported:Date.now()};
  const css = $('#tt-css').textContent, app = $('#tt-app').textContent;
  const html = `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(t.name)}</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="tt-css">${css}</style></head>
<body><header class="top" id="top"></header><main id="root"></main><div class="toast" id="toast"></div><input type="file" id="filepick" hidden>
<script>window.TT_VIEW = ${JSON.stringify(data).replace(/</g,'\\u003c')};<\/script><script id="tt-app">${app}<\/script></body></html>`;
  download('index.html', html, 'text/html'); toast('index.html saved – upload it to GitHub');
}

/* field edits (text inputs): save on input, re-render on change */
function onField(el, final){
  const t = T(), d = el.dataset; if(!state || !t) return; let touched = true;
  if(d.th){ t.theme = Object.assign({a:'#d4a64a', b:'#6f9bd1'}, t.theme||{}, {[d.th]: el.value}); t.themeCustom = true; }
  else if(d.tf){ t[d.tf] = d.tf==='civLimit' ? Math.max(0, +el.value||0) : el.value; if(d.tf==='name') renderTop(); }
  else if(d.lf){ t.links[+d.link][d.lf] = el.value.trim(); }
  else if(d.pf){ state.players[d.p][d.pf] = d.pf==='pid' ? el.value.replace(/\D/g,'') : el.value; }
  else if(d.tmf){ t.teams[+d.team][d.tmf] = el.value; }
  else if(d.sf){ const S = curStage(d.s); let v = el.value;
    if(['bo','boFinal','pts','legs','groups','rounds','size','k','rotGames','perGroup'].includes(d.sf)) v = Math.max(0, +v||0);
    if(d.sf==='bo'||d.sf==='size'||d.sf==='k'||d.sf==='legs'||d.sf==='groups'||d.sf==='rounds') v = Math.max(1, v);
    if(d.sf==='ladder'||d.sf==='third'||d.sf==='neutralFirst') v = v==='true';
    if(d.sf==='series'){ S.playAll = v[0]==='p'; S.bo = +v.slice(1); save(); if(final) render(); return; }
    if(d.sf==='div') v = el.value.trim();
    if(d.sf==='maps') v = el.value.split(',').map(s=>s.trim()).filter(Boolean);
    if(d.sf==='ent' && v!==S.ent){ S.entrants = null; S.manualSeeds = []; }
    S[d.sf] = v; if(d.sf==='seedFrom') S.locked = null;
  } else touched = false;
  if(touched){ save(); if(final) render(); }
}


/* ============ site mode (Firebase): many tournaments, public pages, organiser accounts ============
   Turned on by window.TT_LIVE = {firebase:{...web app config...}} in the page's <head>.
   Firestore layout:
     tournaments/<tid>             {state: save JSON (one tournament, images swapped for ttimg:<id>), imgs:{id:chunks}, admins:[uid], owner:uid, updated}
     tournaments/<tid>/img/<id>_<n>, /games/<matchId>, /pending/<matchId>, /detector/meta
     index/<tid>                   search entry: name, dates, host, counts, accent, listed, admins   (what Home and Tournaments read)
     meta/owners                   {uids:[...]}  site owner(s): can hide or delete any tournament */
const FBU = 'https://www.gstatic.com/firebasejs/12.19.0/', CH = 900000;
const live = { fb:null, user:null, owner:false, admin:false, tid:null, doc:null, unsubT:null, loading:false, imgs:{}, stored:new Set(), lastJson:null, lastIdx:null,
  saving:false, again:false, status:'', bad:false, held:null, route:{page:'home'}, dir:null, dirAt:0, dirErr:'', mine:null, q:'', filter:'all', authMode:'in', authMsg:'', authErr:'', ready:false, pend:[], pendOff:null, games:{} };
function cyrb53(str){ let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i=0;i<str.length;i++){ const c = str.charCodeAt(i); h1 = Math.imul(h1^c, 2654435761); h2 = Math.imul(h2^c, 1597334677); }
  h1 = Math.imul(h1^(h1>>>16), 2246822507) ^ Math.imul(h2^(h2>>>13), 3266489909); h2 = Math.imul(h2^(h2>>>16), 2246822507) ^ Math.imul(h1^(h1>>>13), 3266489909);
  return 4294967296*(2097151&h2) + (h1>>>0); }
function dehydrate(s){ const imgs = {}, blobs = {};
  const json = JSON.stringify(s, (k,v)=>{ if(k==='exported') return undefined;
    if(typeof v==='string' && v.length>1000 && v.startsWith('data:')){ const id = 'i'+cyrb53(v).toString(36)+v.length.toString(36); blobs[id] = v; imgs[id] = Math.ceil(v.length/CH); return 'ttimg:'+id; }
    return v; });
  return {json, imgs, blobs}; }
async function hydrate(json, imgs, tid){ const {fs, d} = live.fb;
  await Promise.all(Object.entries(imgs||{}).filter(([id])=>!(id in live.imgs)).map(async ([id,n])=>{
    const parts = await Promise.all(Array.from({length:n}, (_,i)=>fs.getDoc(fs.doc(d,'tournaments',tid,'img',id+'_'+i))));
    live.imgs[id] = parts.map(p=>p.exists() ? p.data().d : '').join(''); live.stored.add(id); }));
  return JSON.parse(json, (k,v)=> typeof v==='string' && v.startsWith('ttimg:') ? (live.imgs[v.slice(6)]||'') : v); }
function liveStatus(msg, bad){ live.status = msg; live.bad = !!bad; const el = document.getElementById('livest'); if(el){ el.textContent = msg; el.classList.toggle('bad', !!bad); } }
const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
const todayStr = () => { const n = new Date(), p = x=>String(x).padStart(2,'0'); return `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`; };
function tstat(i){ const t = todayStr(); if(i.start && t < i.start) return 'soon'; if((i.end||i.start) && t > (i.end||i.start)) return 'done'; return i.start ? 'live' : 'soon'; }

/* ---------- boot ---------- */
async function liveBoot(){
  try{
    const [app, fs, au] = await Promise.all(['firebase-app','firebase-firestore','firebase-auth'].map(n=>import(FBU+n+'.js')));
    const a = app.initializeApp(LIVE.firebase), d = fs.getFirestore(a), auth = au.getAuth(a);
    if(LIVE.emulator){ fs.connectFirestoreEmulator(d, '127.0.0.1', LIVE.emulator.firestore); au.connectAuthEmulator(auth, 'http://127.0.0.1:'+LIVE.emulator.auth, {disableWarnings:true}); }
    live.fb = {fs, au, d, auth};
  }catch(e){ $('#root').innerHTML = `<div class="wrap"><div class="card empty">The site couldn't load its data. Check your connection and reload the page.</div></div>`; return; }
  const {fs, au, auth, d} = live.fb;
  window.addEventListener('hashchange', routeChanged);
  au.onAuthStateChanged(auth, async u=>{
    live.user = u; live.owner = false;
    if(u){ try{ const m = await fs.getDoc(fs.doc(d,'meta','owners')); live.owner = !!(m.exists() && (m.data().uids||[]).includes(u.uid)); }catch(e){} }
    live.ready = true; computeAdmin(); if(live.route.page==='organiser') loadMine(true); render();
  });
  routeChanged();
}
function parseRoute(){ const h = (location.hash||'#/').replace(/^#\/?/,''), [path, qs] = h.split('?'), [p, id] = path.split('/'), q = new URLSearchParams(qs||'');
  if(p==='t' && id) return {page:'t', tid:id};
  if(p==='browse') return {page:'browse', q:q.get('q')||''};
  if(p==='organiser') return {page:'organiser'};
  return {page:'home'}; }
function routeChanged(){
  const r = parseRoute(); live.route = r; document.body.classList.remove('menu'); window.scrollTo(0,0);
  if(r.page==='t'){ if(live.tid!==r.tid) openTournament(r.tid); } else if(live.tid) closeTournament();
  if(r.page==='browse') live.q = r.q;
  if(r.page==='home'||r.page==='browse') loadDir();
  if(r.page==='organiser') loadMine();
  render();
}

/* ---------- directory (search) ---------- */
async function loadDir(force){
  if(!live.fb || (!force && live.dir && Date.now()-live.dirAt < 60000)) return;
  try{ const {fs, d} = live.fb, s = await fs.getDocs(fs.query(fs.collection(d,'index'), fs.where('listed','==',true), fs.limit(200)));
    live.dir = s.docs.filter(x=>x.data().pub!==false).map(x=>{ const v = x.data(); return Object.assign({id:x.id}, v, {ts: v.updated && v.updated.toMillis ? v.updated.toMillis() : 0}); }); live.dirAt = Date.now(); live.dirErr = '';
  }catch(e){ live.dirErr = e.code||e.message; live.dir = live.dir || []; }
  if(live.route.page==='home'||live.route.page==='browse') render();
}
async function loadMine(force){
  if(!live.fb || !live.user){ live.mine = null; return; }
  try{ const {fs, d} = live.fb, s = await fs.getDocs(fs.query(fs.collection(d,'index'), fs.where('admins','array-contains',live.user.uid), fs.limit(100)));
    live.mine = s.docs.map(x=>Object.assign({id:x.id}, x.data())).sort((a,b)=>(b.start||'').localeCompare(a.start||'')); }catch(e){ live.mine = []; live.dirErr = e.code||e.message; }
  if(live.route.page==='organiser') render();
}

/* ---------- one tournament ---------- */
function openTournament(tid){
  closeTournament(); live.tid = tid; live.loading = true; state = null; live.doc = null; live.lastJson = null; live.lastIdx = null; live.imgs = {}; live.stored = new Set();
  live.admin = false; VIEW = true; ui.tab = live.nextTab || 'home'; live.nextTab = null; ui.stage = null; ui.player = null; ui.setup = 'event'; live.status = '';
  const {fs, d} = live.fb; eloLoad(tid);
  live.unsubT = fs.onSnapshot(fs.doc(d,'tournaments',tid), snap=>snapHandler(snap, tid), err=>{ if(live.tid!==tid) return; live.loading = false; liveStatus('Could not load this tournament: '+(err.code||err.message), true); render(); });
}
function closeTournament(){
  if(live.admin && saveTimer){ clearTimeout(saveTimer); saveTimer = null; liveSave(); }    // flush edits before leaving
  if(live.unsubT){ live.unsubT(); live.unsubT = null; } pendListen(false);
  live.tid = null; live.doc = null; state = null; live.admin = false; VIEW = true; live.lastJson = null; live.loading = false;
}
function computeAdmin(){ const was = live.admin, d = live.doc, u = live.user;
  live.admin = !!(u && d && live.tid && (live.owner || (d.admins||[]).includes(u.uid))); VIEW = !live.admin;
  if(live.admin!==was) pendListen(live.admin); }
async function snapHandler(snap, tid){
  if(live.tid!==tid || snap.metadata.hasPendingWrites) return;
  live.loading = false;
  const data = snap.exists() ? snap.data() : null; live.doc = data;
  if(data && data.imgs) Object.keys(data.imgs).forEach(id=>live.stored.add(id));
  if(!data){ state = null; computeAdmin(); render(); return; }
  const same = state && data.state === live.lastJson;
  computeAdmin();
  if(same){ if(live.route.page==='t') liveRender(); return; }                    // our own save coming back (or only the organiser list changed)
  if(live.admin && (saveTimer || live.saving)) return;                          // unsaved local edits win; the next save goes up
  try{
    const s = await hydrate(data.state, data.imgs, tid); if(live.tid!==tid) return;
    if(!validState(s)) throw 0;
    const cur = state && state.cur; state = s; if(cur && state.tours.some(t=>t.id===cur)) state.cur = cur; if(!state.cur && state.tours[0]) state.cur = state.tours[0].id;
    state.exported = data.updated && data.updated.toMillis ? data.updated.toMillis() : null;
    live.lastJson = data.state; liveStatus(live.admin ? 'Saved online' : '');
    liveRender();
  }catch(e){ liveStatus('This tournament could not be read.', true); render(); }
}
/* re-render for a remote change, but never under someone typing */
function liveRender(){ const a = document.activeElement;
  if(!VIEW && a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA') && a.type!=='button'){ if(!live.held){ live.held = ()=>{ live.held = null; render(); }; a.addEventListener('blur', live.held, {once:true}); } return; }
  render(); }

/* ---------- saving (organisers) ---------- */
function summaryOf(st){
  const t = (st.tours||[])[0] || {}, used = new Set(t.roster||[]); (t.teams||[]).forEach(tm=>(tm.members||[]).forEach(x=>used.add(x)));
  let done = 0, total = 0; try{ allMatches(t).forEach(({S,m})=>{ const sd = sidesOf(S,m,t); if(!sd[0]||!sd[1]) return; total++; if(winnerOf(S,m,sd)!=null) done++; }); }catch(e){}
  const start = t.start||'', end = t.end||'', endMs = Date.parse((end||start||todayStr())+'T00:00:00Z') + (end||start ? 0 : 60*864e5);

async function liveSave(){
  const tid = live.tid; if(!live.admin || !live.fb || !tid || !state) return;
  if(live.saving){ live.again = true; return; }
  live.saving = true; const {fs, d} = live.fb, ref = fs.doc(d,'tournaments',tid);
  try{
    const {json, imgs, blobs} = dehydrate(state), sum = summaryOf(state);
    if(json.length > 1000000) throw new Error('the save is too big for one online record ('+Math.round(json.length/1024)+' KB)');
    for(const [id,v] of Object.entries(blobs)){ if(live.stored.has(id)) continue; liveStatus('Uploading images…');
      for(let i=0;i*CH<v.length;i++) await fs.setDoc(fs.doc(d,'tournaments',tid,'img',id+'_'+i), {d:v.slice(i*CH,(i+1)*CH)});
      live.stored.add(id); live.imgs[id] = v; }
    if(json !== live.lastJson){
      await fs.updateDoc(ref, {state:json, imgs, updated:fs.serverTimestamp(), by:live.user.uid, app:APP_VERSION});
      live.lastJson = json; }
    const si = JSON.stringify(sum);
    if(si !== live.lastIdx){ await fs.setDoc(fs.doc(d,'index',tid), Object.assign({}, sum, {admins:(live.doc&&live.doc.admins)||[live.user.uid], owner:(live.doc&&live.doc.owner)||live.user.uid, updated:fs.serverTimestamp()}), {merge:true}); live.lastIdx = si; live.dirAt = 0; }
    if(live.tid===tid) liveStatus('Saved online '+new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}));
  }catch(e){ if(live.tid===tid) liveStatus('NOT saved online: '+(e.code||e.message), true); }
  finally{ live.saving = false; if(live.again){ live.again = false; liveSave(); } }
}

function rgb2hsl(r,g,b){ r/=255; g/=255; b/=255; const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2, dd = mx-mn; let h = 0, s = 0;
  if(dd){ s = dd/(1-Math.abs(2*l-1)); h = mx===r ? ((g-b)/dd)%6 : mx===g ? (b-r)/dd+2 : (r-g)/dd+4; h = (h*60+360)%360; } return [h,s,l]; }
function hsl2hex(h,s,l){ const c = (1-Math.abs(2*l-1))*s, x = c*(1-Math.abs((h/60)%2-1)), m = l-c/2; const [r,g,b] = h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return '#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join(''); }
const lumOf = hex => { const [r,g,b] = [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4)); return .2126*r+.7152*g+.0722*b; };
async function paletteOf(url){
  const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = url; });
  const c = document.createElement('canvas'), W = 64, H = Math.max(8, Math.round(64*img.height/img.width)||64); c.width = W; c.height = Math.min(H, 96); const g = c.getContext('2d'); g.drawImage(img,0,0,c.width,c.height);
  const px = g.getImageData(0,0,c.width,c.height).data, bins = Array.from({length:18}, ()=>({w:0,r:0,g:0,b:0}));
  for(let i=0;i<px.length;i+=4){ if(px[i+3]<200) continue; const [h,s,l] = rgb2hsl(px[i],px[i+1],px[i+2]); if(s<.28 || l<.12 || l>.9) continue;
    const w = s*(1-Math.abs(2*l-1)), k = bins[Math.floor(h/20)%18]; k.w += w; k.r += px[i]*w; k.g += px[i+1]*w; k.b += px[i+2]*w; }
  const top = bins.map((k,i)=>({i,k})).filter(x=>x.k.w>0).sort((a,b)=>b.k.w-a.k.w); if(!top.length) return null;
  const col = k => { const [h,s,l] = rgb2hsl(k.r/k.w, k.g/k.w, k.b/k.w); return [h, Math.min(.85,Math.max(.5,s)), Math.min(.66,Math.max(.5,l))]; };   // readable on the dark pages
  const [h1,s1,l1] = col(top[0].k), second = top.find(x=>{ const d = Math.abs(x.i-top[0].i); return Math.min(d,18-d) >= 2; });
  const [h2,s2,l2] = second ? col(second.k) : [(h1+30)%360, s1*.8, l1];
  return {a:hsl2hex(h1,s1,l1), b:hsl2hex(h2,s2,l2)};
}

function teamStats(tm, t){

  const S0 = t.stages.find(S=>S.div && stageEntrants(S,t).includes(k)); if(S0) st.div = S0.div;

    const si = sd.findIndex(side=>side.includes(k)); if(si<0) return;
    const w = winnerOf(S,m,sd), sc = score(m); if(w!=null){ if(w===si) st.w++; else st.l++; }
    (m.games||[]).forEach(g=>{ if(g.w!==0&&g.w!==1) return; const won = g.w===si; if(won) st.gw++; else st.gl++;
      if(g.map){ const x = st.maps[g.map]||(st.maps[g.map]={n:0,w:0}); x.n++; if(won) x.w++; }
      tm.members.forEach(id=>{ const c = (g.civs||{})[id]; if(c){ const x = st.civs[c]||(st.civs[c]={n:0,w:0}); x.n++; if(won) x.w++; }
        const s = g.st && g.st[id]; if(s && s.eapm!=null){ st.e += s.eapm; st.en++; } }); });
    st.list.push({S, m, si, sd, w, sc}); });
  st.place = null; divs(t).forEach(dv=>{ if(!finalResult(t,dv).champ) return; const f = finalOrder(t,dv).find(p=>p.k===k); if(f) st.place = f; });
  return st;
}

/* ---------- Ranked ELOs (saved by the game finder), fuller player pages, tournament Stats tab ---------- */
const LADDER = {rm1:'1v1 ELO', rmt:'Team ELO', ew1:'EW ELO', ewt:'Team EW ELO'};
const MODES = [['rm1','1v1 Random Map'],['rmt','Team Random Map'],['ew1','1v1 Empire Wars'],['ewt','Team Empire Wars']];
const modeOf = t => LADDER[t.mode] ? t.mode : (t.teams.length ? 'rmt' : 'rm1');
const eloCols = t => modeOf(t)==='rm1' ? ['rm1'] : ['rm1', modeOf(t)];
function eloLoad(tid){ live.elo = null; if(!live.fb) return; const {fs, d} = live.fb;
  fs.getDoc(fs.doc(d,'tournaments',tid,'detector','elo')).then(s=>{ if(live.tid!==tid || !s.exists()) return; live.elo = s.data(); if(state) liveRender(); }).catch(()=>{}); }
const eloOf = (id,k) => { const e = LIVE && live.elo && live.elo.p && live.elo.p[id] && live.elo.p[id][k]; return e && e.r ? e : null; };
const eloTxt = (id,k) => { const e = eloOf(id,k); return e ? String(e.r) : '–'; };
const hasElo = t => t.roster.concat(t.teams.flatMap(x=>x.members)).some(id=>eloCols(t).some(k=>eloOf(id,k)));
function eloAvg(ids, k){ const v = ids.map(id=>eloOf(id,k)).filter(Boolean).map(e=>e.r); return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : null; }
const eloNote = () => live.elo && live.elo.at ? `Ranked ELOs from aoe2companion, updated ${new Date(live.elo.at*1000).toLocaleDateString('en-AU',{day:'numeric',month:'short'})}.` : '';

const tsec = v => { const m = /^(?:(\d+):)?(\d+):(\d\d)$/.exec(String(v||'').trim()); return m ? (+(m[1]||0))*3600 + +m[2]*60 + +m[3] : null; };
const mmss = s => s==null ? '–' : (s>=3600 ? Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0') : Math.floor(s/60)) + ':' + String(Math.round(s%60)).padStart(2,'0');
/* every decided map of the tournament, with who actually played it on each side */
function mapGames(t){ const out = [];
  allMatches(t).forEach(({S,m})=>{ const sd = sidesOf(S,m,t); if(!sd[0]||!sd[1]||!sd[0].length||!sd[1].length) return;
    (m.games||[]).forEach((g,gi)=>{ if(!g || (g.w!==0&&g.w!==1)) return; const civs = g.civs||{}, any = Object.values(civs).some(Boolean);
      const on = sd.map(side=>side.flatMap(k=>entMembers(k,t)).filter(id=>!any || civs[id]));
      out.push({S, m, g, gi, sd, on, civs, len:tsec(g.len)}); }); });
  return out; }
function playerGames(id, t){ return mapGames(t).filter(x=>x.on[0].includes(id)||x.on[1].includes(id)).map(x=>{ const si = x.on[0].includes(id)?0:1; return {...x, si, won:x.g.w===si, st:(x.g.st||{})[id]||null}; }); }
const avgOf = a => { a = a.filter(v=>v!=null && !isNaN(v)); return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; };
function replayNums(list){ const st = list.map(x=>x.st).filter(Boolean), op = {};
  st.forEach(s=>{ if(s.opening) op[s.opening] = (op[s.opening]||0)+1; });
  return {n:st.length, eapm:avgOf(st.map(s=>s.eapm)), apm:avgOf(st.map(s=>s.apm)), feudal:avgOf(st.map(s=>tsec(s.feudal))), castle:avgOf(st.map(s=>tsec(s.castle))), imp:avgOf(st.map(s=>tsec(s.imp))),
    tcIdle:avgOf(st.map(s=>s.tcIdle)), opening:(Object.entries(op).sort((a,b)=>b[1]-a[1])[0]||[])[0]||''}; }
const tile = (k,v,sub,txt) => `<div class="card stat ${txt?'txt':''}"><span>${k}</span><b title="${esc(String(v).replace(/<[^>]+>/g,''))}">${v}</b>${sub?`<i>${sub}</i>`:''}</div>`;
const formStrip = list => `<span class="formrow">${list.map(x=>`<i class="${x.won?'W':'L'}" title="${esc((x.g.map||'Map')+' v '+sideName(x.sd[1-x.si]))}">${x.won?'W':'L'}</i>`).join('')}</span>`;
const plLinks = p => p.pid ? `<div class="small"><a href="https://www.aoe2insights.com/user/${encodeURIComponent(p.pid)}/" target="_blank" rel="noopener">AoE2 Insights</a> · <a href="https://www.aoe2companion.com/players/${encodeURIComponent(p.pid)}" target="_blank" rel="noopener">aoe2companion</a></div>` : '';

function playerProfile(id, t){
  const p = P(id), x = playerStats(id,t), mine = playerGames(id,t), rp = replayNums(mine);
  let streak = 0, sT = null; for(let k=mine.length-1;k>=0;k--){ if(sT===null) sT = mine[k].won; if(mine[k].won===sT) streak++; else break; }
  const opp = {}, mates = {}, civ = {}, map = {};
  const bump = (o,k,won) => { const r = o[k] = o[k]||{w:0,l:0}; won ? r.w++ : r.l++; };
  mine.forEach(g=>{ bump(opp, sideName(g.sd[1-g.si]), g.won); g.on[g.si].filter(o=>o!==id&&state.players[o]).forEach(o=>bump(mates,o,g.won));
    if(g.civs[id]) bump(civ, g.civs[id], g.won); if(g.g.map) bump(map, g.g.map, g.won); });
  const pick = (o,sc) => { const e = Object.entries(o); if(!e.length) return null; e.sort((a,b)=>sc(b[1])-sc(a[1])); return e[0]; };
  const nem = pick(opp, r=>r.l*10-r.w), vic = pick(opp, r=>r.w*10-r.l), bc = pick(civ, r=>r.w*10-r.l), bm = pick(map, r=>r.w*10-r.l), bp = pick(mates, r=>r.w*10-r.l);
  const fun = [bc&&bc[1].w?tile('Best civ', esc(bc[0]), `${bc[1].w}–${bc[1].l}`, 1):'', bm&&bm[1].w?tile('Best map', esc(bm[0]), `${bm[1].w}–${bm[1].l}`, 1):'',
    nem&&nem[1].l?tile('Toughest opponent', esc(nem[0]), `lost ${nem[1].l} of ${nem[1].w+nem[1].l} maps`, 1):'', vic&&vic[1].w?tile('Best record against', esc(vic[0]), `won ${vic[1].w} of ${vic[1].w+vic[1].l} maps`, 1):'',
    bp&&bp[1].w&&Object.keys(mates).length>1?tile('Best team-mate', esc(P(bp[0]).name), `${bp[1].w}–${bp[1].l} together`, 1):''].join('');
  const elo = eloCols(t).filter(k=>eloOf(id,k)).map(k=>{ const e = eloOf(id,k); return tile(LADDER[k], e.r, e.max?`peak ${e.max}`:'ranked ladder'); }).join('');
  const rep = rp.n ? `<div class="card"><h3>Replay averages</h3><div class="small muted">From ${rp.n} game${rp.n>1?'s':''} with a replay.</div><div class="statrow in">
      ${tile('eAPM', rp.eapm!=null?Math.round(rp.eapm):'–')}${rp.apm!=null?tile('APM', Math.round(rp.apm)):''}${tile('Feudal', mmss(rp.feudal))}${tile('Castle', mmss(rp.castle))}${tile('Imperial', mmss(rp.imp))}${rp.tcIdle!=null?tile('TC idle', mmss(rp.tcIdle), 'per game'):''}${rp.opening?tile('Usual opening', esc(rp.opening), '', 1):''}</div></div>` : '';
  const h2h = Object.entries(opp).sort((a,b)=>(b[1].w+b[1].l)-(a[1].w+a[1].l)).map(([k,r])=>`<tr><td>${esc(k)}</td><td class="n">${r.w}</td><td class="n">${r.l}</td><td class="n">${pct(r.w,r.w+r.l)}</td></tr>`).join('');
  const withT = Object.entries(mates).sort((a,b)=>(b[1].w+b[1].l)-(a[1].w+a[1].l)).map(([k,r])=>`<tr><td>${esc(P(k).name)}</td><td class="n">${r.w}</td><td class="n">${r.l}</td><td class="n">${pct(r.w,r.w+r.l)}</td></tr>`).join('');
  const anySt = mine.some(g=>g.st), anyLen = mine.some(g=>g.len!=null);
  const games = mine.map(g=>`<tr><td class="small">${esc(g.S.name)}<div class="muted">${esc(matchLabel(g.S,g.m))} · map ${g.gi+1}</div></td><td>${sideHtml(g.sd[1-g.si])}</td><td>${esc(g.civs[id]||'–')}</td><td>${esc(g.g.map||'–')}</td>
    ${anyLen?`<td class="n">${esc(g.g.len||'–')}</td>`:''}${anySt?`<td class="n">${g.st&&g.st.eapm!=null?g.st.eapm:'–'}</td><td class="n">${g.st&&g.st.feudal?esc(g.st.feudal):'–'}</td>`:''}<td>${g.won?'<b style="color:var(--win)">Won</b>':'<span style="color:var(--loss)">Lost</span>'}${typeof statsBtn==='function'?statsBtn(g.g):''}</td></tr>`).join('');
  const series = x.list.map(({S,m,si,sd,w,sc})=>`<tr><td class="small">${esc(S.name)}<div class="muted">${esc(matchLabel(S,m))}</div></td><td>${sideHtml(sd[1-si])}</td><td class="n">${sc[si]}–${sc[1-si]}</td><td>${w==null?'<span class="muted small">to play</span>':w===si?'<b style="color:var(--win)">Won</b>':'<span style="color:var(--loss)">Lost</span>'}</td></tr>`).join('');
  return `<p><button class="sm" data-act="player" data-v="">‹ All players</button></p>
    <div class="card thead">${p.photo?`<img class="pphoto" src="${p.photo}" alt="">`:''}
      <div><h2 style="margin:0">${esc(p.name)}</h2><div class="muted">${[x.team?x.team.name+(x.team.cap===id?' · captain':''):'', x.place?'finished '+ord(x.place.place):''].filter(Boolean).map(esc).join(' · ')}</div>${plLinks(p)}</div>
      ${mine.length?`<div class="formbox"><span class="small muted">Last ${Math.min(5,mine.length)} map${mine.length>1?'s':''}</span>${formStrip(mine.slice(-5))}</div>`:''}</div>
    <div class="statrow">${tile('Series', `${x.w}–${x.l}`)}${tile('Maps', `${x.gw}–${x.gl}`, pct(x.gw,x.gw+x.gl)+' won')}${tile('Streak', streak?(sT?'W':'L')+streak:'–', streak?(sT?'maps won in a row':'maps lost in a row'):'no maps yet')}${elo}</div>
    ${fun?`<div class="statrow">${fun}</div>`:''}
    ${rep}
    <div class="grid g2"><div class="card"><h3>Civs</h3>${wlTable(x.civs,'Civ')}</div><div class="card"><h3>Maps</h3>${wlTable(x.maps,'Map')}</div></div>
    ${h2h||withT?`<div class="grid g2"><div class="card"><h3>Against</h3>${h2h?`<table><tr><th>Opponent</th><th class="n">Maps won</th><th class="n">Lost</th><th class="n">Win %</th></tr>${h2h}</table>`:'<div class="muted small">None yet.</div>'}</div>
      ${withT?`<div class="card"><h3>Played with</h3><table><tr><th>Team-mate</th><th class="n">Maps won</th><th class="n">Lost</th><th class="n">Win %</th></tr>${withT}</table></div>`:''}</div>`:''}
    <div class="card"><h3>Every map</h3>${games?`<div class="tablewrap"><table><tr><th>Stage</th><th>Against</th><th>Civ</th><th>Map</th>${anyLen?'<th class="n">Length</th>':''}${anySt?'<th class="n">eAPM</th><th class="n">Feudal</th>':''}<th></th></tr>${games}</table></div>`:'<div class="muted">No maps played yet.</div>'}</div>
    <div class="card"><h3>Series</h3>${series?`<div class="tablewrap"><table><tr><th>Stage</th><th>Against</th><th class="n">Maps</th><th></th></tr>${series}</table></div>`:'<div class="muted">None yet.</div>'}</div>`;
}

/* Stats tab: the whole tournament's civs, maps and replay records */
function pageStats(){
  const t = T(), gs = mapGames(t);
  if(!gs.length) return `<div class="card empty">No maps have been played yet. Civ, map and replay stats show here once results are in.</div>`;
  const civ = {}, map = {}, recs = [];
  gs.forEach(x=>{ if(x.g.map){ const r = map[x.g.map] = map[x.g.map]||{n:0,len:[]}; r.n++; if(x.len!=null) r.len.push(x.len); }
    [0,1].forEach(si=>x.on[si].forEach(id=>{ const c = x.civs[id]; if(c){ const r = civ[c] = civ[c]||{n:0,w:0,by:{}}; r.n++; if(x.g.w===si) r.w++; r.by[id] = (r.by[id]||0)+1; }
      const s = (x.g.st||{})[id]; if(s) recs.push({id, x, s}); })); });
  const civs = Object.entries(civ).sort((a,b)=>b[1].n-a[1].n||b[1].w-a[1].w), maps = Object.entries(map).sort((a,b)=>b[1].n-a[1].n);
  const minC = gs.length>=20 ? 3 : 2, q = civs.filter(c=>c[1].n>=minC), best = q.slice().sort((a,b)=>b[1].w/b[1].n-a[1].w/a[1].n||b[1].n-a[1].n)[0], worst = q.slice().sort((a,b)=>a[1].w/a[1].n-b[1].w/b[1].n||b[1].n-a[1].n)[0];
  const timed = gs.filter(x=>x.len!=null).sort((a,b)=>b.len-a.len), gl = x => `${sideName(x.sd[0])} v ${sideName(x.sd[1])}, ${x.g.map||'map '+(x.gi+1)}`;
  const top = (f,low) => { const v = recs.map(r=>({r, v:f(r.s)})).filter(o=>o.v!=null && !isNaN(o.v)).sort((a,b)=>low?a.v-b.v:b.v-a.v)[0]; return v||null; };
  const rt = (k,o,fmt) => o ? tile(k, fmt(o.v), `${esc(P(o.r.id).name)} · ${esc(o.r.x.g.map||'')}`) : '';
  const hi = top(s=>s.eapm), fe = top(s=>tsec(s.feudal),1), ca = top(s=>tsec(s.castle),1), im = top(s=>tsec(s.imp),1);
  const cards = [civs.length?tile('Most picked civ', esc(civs[0][0]), `${civs[0][1].n} picks`, 1):'', best?tile(`Best civ (${minC}+ picks)`, esc(best[0]), `${best[1].w}–${best[1].n-best[1].w} · ${pct(best[1].w,best[1].n)}`, 1):'',
    worst&&worst!==best?tile(`Worst civ (${minC}+ picks)`, esc(worst[0]), `${worst[1].w}–${worst[1].n-worst[1].w} · ${pct(worst[1].w,worst[1].n)}`, 1):'', maps.length?tile('Most played map', esc(maps[0][0]), `${maps[0][1].n} games`, 1):'',
    timed.length?tile('Longest game', mmss(timed[0].len), esc(gl(timed[0]))):'', timed.length>1?tile('Quickest game', mmss(timed[timed.length-1].len), esc(gl(timed[timed.length-1]))):''].join('');
  const rcards = [rt('Highest eAPM',hi,v=>Math.round(v)), rt('Fastest Feudal',fe,mmss), rt('Fastest Castle',ca,mmss), rt('Fastest Imperial',im,mmss)].join('');
  const ids = [...new Set(t.roster.concat(t.teams.flatMap(x=>x.members)))].filter(id=>state.players[id]), ec = hasElo(t) ? eloCols(t) : [];
  const prow = ids.map(id=>{ const l = playerGames(id,t); return {id, l, w:l.filter(g=>g.won).length, r:replayNums(l)}; }).filter(o=>o.l.length || ec.some(k=>eloOf(o.id,k)))
    .sort((a,b)=>(b.r.eapm||0)-(a.r.eapm||0) || b.w-a.w || P(a.id).name.localeCompare(P(b.id).name));
  const anyRp = prow.some(o=>o.r.n);
  return `<h2 class="sech">Tournament stats</h2><div class="statrow">${tile('Maps played', gs.length)}${cards}</div>
    ${rcards?`<h2 class="sech">Replay records</h2><div class="statrow">${rcards}</div>`:''}
    <div class="grid g2"><div class="card"><h3>Civs</h3><div class="tablewrap"><table><tr><th>Civ</th><th class="n">Picks</th><th class="n">Won</th><th class="n">Win %</th><th>Most by</th></tr>
      ${civs.map(([k,r])=>{ const by = Object.entries(r.by).sort((a,b)=>b[1]-a[1])[0]; return `<tr><td>${esc(k)}</td><td class="n">${r.n}</td><td class="n">${r.w}</td><td class="n">${pct(r.w,r.n)}</td><td class="small">${by&&state.players[by[0]]?esc(P(by[0]).name)+(by[1]>1?` (${by[1]})`:''):''}</td></tr>`; }).join('')}</table></div></div>
    <div class="card"><h3>Maps</h3><div class="tablewrap"><table><tr><th>Map</th><th class="n">Games</th><th class="n">Avg length</th></tr>
      ${maps.map(([k,r])=>`<tr><td>${esc(k)}</td><td class="n">${r.n}</td><td class="n">${r.len.length?mmss(avgOf(r.len)):'–'}</td></tr>`).join('')}</table></div></div></div>
    <div class="card"><h3>Players</h3><div class="small muted">Click a player for their full stats. ${ec.length?esc(eloNote()):''}</div><div class="tablewrap"><table><tr><th>Player</th>${ec.map(k=>`<th class="n">${LADDER[k]}</th>`).join('')}<th class="n">Maps W–L</th><th class="n">Win %</th>${anyRp?'<th class="n">eAPM</th><th class="n">Feudal</th><th class="n">Castle</th><th class="n">Imperial</th><th>Usual opening</th>':''}</tr>
      ${prow.map(o=>`<tr style="cursor:pointer" data-act="tplayer" data-v="${o.id}"><td>${chip('p:'+o.id,t)}</td>${ec.map(k=>`<td class="n">${eloTxt(o.id,k)}</td>`).join('')}<td class="n">${o.w}–${o.l.length-o.w}</td><td class="n">${pct(o.w,o.l.length)}</td>${anyRp?`<td class="n">${o.r.eapm!=null?Math.round(o.r.eapm):'–'}</td><td class="n">${mmss(o.r.feudal)}</td><td class="n">${mmss(o.r.castle)}</td><td class="n">${mmss(o.r.imp)}</td><td class="small">${esc(o.r.opening)}</td>`:''}</tr>`).join('')}</table></div></div>`;
}

/* ============ boot ============ */
document.addEventListener('click', e=>{ const el = e.target.closest('[data-act]'); if(!el || el.tagName==='SELECT' || (el.tagName==='INPUT' && el.type!=='button')) return; act(el, e); });
document.addEventListener('change', e=>{ const el = e.target; if(el.dataset.act && (el.tagName==='SELECT'||el.tagName==='INPUT')){ act(el, e); return; } onField(el, true); });
document.addEventListener('keydown', e=>{ const el = e.target; if(e.key==='Enter' && el.dataset && el.dataset.mapin){ e.preventDefault(); const b = document.querySelector(`button[data-act="mapadd"][data-s="${el.dataset.mapin}"]`); if(b) act(b,e); } });
document.addEventListener('input', e=>{ const el = e.target; if(el.dataset.act) return; if(el.type==='text'||el.type==='url'||el.tagName==='TEXTAREA') onField(el, false); });
(async function boot(){
  if(LIVE){ try{ db = await idb(); }catch(e){ db = null; } $('#root').innerHTML = '<div class="wrap"><p class="muted">Loading…</p></div>'; liveBoot(); return; }
  if(VIEW){ state = window.TT_VIEW; }
  else { state = await load(); if(!validState(state)) state = blankState(); }
  if(!state.cur && state.tours[0]) state.cur = state.tours[0].id;
  render();
})();
</script>
</body>
