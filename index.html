<style id="tt-css">
:root{
  --bg:#2a2f36; --rail:#21252b; --card:#333940; --raised:#3e454d; --line:#4a525b; --line2:#646e79;
  --ink:#eceff2; --muted:#b0b8c1; --link:#93bbee;
  --accent:#d4a64a; --accent2:#6f9bd1; --accent-ink:#15181b; --gold:var(--accent); --gold-l:color-mix(in srgb,var(--accent) 16%,transparent);
  --steel:#41678f; --win:#79c98a; --win-bg:#2f7d3a; --loss:#ef7a6e; --spoon:#d1a46c; --live:#ef6c5f;
  --head:'Cinzel', Georgia, serif; --body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body)}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:var(--raised);border-radius:6px;padding:5px 11px}
button:hover{border-color:var(--gold)}
button.pri{background:var(--steel);color:#fff;border-color:var(--steel)}
button.gold{background:var(--gold);color:var(--accent-ink);border-color:var(--gold)}
button.danger{color:var(--loss)}
button.sm{padding:2px 8px;font-size:.85rem}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{border:1px solid var(--line2);border-radius:6px;padding:5px 8px;background:var(--raised);max-width:100%}
textarea{width:100%;min-height:70px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted);min-width:0}
label.f > *{color:var(--ink);font-size:1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > label.f{flex:1 1 160px}
header.top{background:var(--rail);color:var(--ink);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header.top .brand{font-family:var(--head);font-size:1.15rem;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
header.top .brand img{height:34px;width:34px;object-fit:contain;border-radius:4px}
header.top select{background:var(--raised);color:var(--ink);border-color:var(--line2)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{background:transparent;color:var(--muted);border:1px solid transparent}
nav.tabs button.on{background:var(--gold);color:var(--accent-ink)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3{font-family:var(--head);margin:0 0 10px}
h2{font-size:1.35rem;margin-top:6px}
h3{font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:99px;background:var(--raised);border:1px solid var(--line);white-space:nowrap;font-weight:600}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.chip img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.chip.tbd{color:var(--muted);font-weight:500;font-style:italic}
.side{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.84rem;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.hero{position:relative;border-radius:12px;overflow:hidden;margin-bottom:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent2) 34%,#1b1f24),#1b1f24);color:#fff}
.hero .bn{display:block;width:100%;max-height:300px;object-fit:cover}
.hero .ov{padding:16px 18px;display:flex;gap:16px;align-items:center}
.hero.hasbn .ov{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.hero .lg{height:84px;width:84px;object-fit:contain;flex:none}
.hero h1{font-size:clamp(1.4rem,4vw,2.2rem);margin:0}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-block;padding:6px 12px;border-radius:6px;background:var(--steel);color:#fff;text-decoration:none;font-weight:600}
.links a.doc{background:var(--gold);color:var(--accent-ink)}
.podium{display:flex;gap:12px;flex-wrap:wrap}
.podium div{flex:1 1 180px;border-radius:10px;padding:10px 14px;background:var(--raised);border:1px solid var(--line)}
.podium .c1{border-color:var(--gold);background:var(--gold-l)}
.podium b{display:block;font-family:var(--head);font-size:.85rem;color:var(--muted)}
.stagebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stagebar button.on{background:var(--steel);color:#fff;border-color:var(--steel)}
.match{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.match.done{border-left:4px solid var(--win)}
.match .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.match .lbl{font-size:.85rem;color:var(--muted);width:100%}
.match .vs{color:var(--muted);font-size:.85rem}
.match .sc{font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto;font-size:1.05rem}
.match .won{outline:2px solid var(--win);border-radius:99px}
.games{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.game{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.game .gn{width:26px;color:var(--muted)}
.game button.on{background:var(--win-bg);color:#fff;border-color:var(--win-bg)}
.civs{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 4px 32px}
.civs label{font-size:.8rem;color:var(--muted);display:flex;gap:4px;align-items:center}
.civs select.over{border-color:var(--loss);background:color-mix(in srgb,var(--loss) 22%,var(--raised))}
.rounds{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.bracket{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
.bracket .col{min-width:250px;display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.bracket .col h3{text-align:center;font-size:.9rem}
.sub{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sub button.on{background:var(--ink);color:var(--bg)}
.plist .pr{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pr .av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.pr input[type=text]{width:140px}
.pr input.num{width:100px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative}
.thumbs img{height:90px;border-radius:6px;display:block}
.thumbs figure button{position:absolute;top:3px;right:3px}
.gallery{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.gallery img{width:100%;border-radius:8px;display:block}
.stagecard{border-left:4px solid var(--steel)}
.note{background:var(--gold-l);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.warn{color:var(--loss)}
.badge{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--ink);margin-left:6px;vertical-align:middle}
.modal{position:fixed;inset:0;background:rgba(20,14,8,.5);display:grid;place-items:center;z-index:60;padding:16px}
.mbox{background:var(--card);border-radius:10px;padding:16px 18px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.nosave{background:#a23a2e;color:#fff;text-align:center;padding:6px 12px;font-size:.9rem}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#15181b;padding:8px 16px;border-radius:8px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
details.box{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--raised);margin-top:8px}
details.box summary{cursor:pointer;font-weight:600}
.view .edit-only{display:none!important}
@media (max-width:640px){ nav.tabs{margin-left:0} .pr input[type=text]{width:110px} }
@media print{ header.top,.sub,.stagebar,.edit-only{display:none!important} body{background:#fff} }

/* ===== dark-grey theme, site shell, per-tournament colours ===== */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input[type=email],input[type=password],input[type=search]{border:1px solid var(--line2);border-radius:6px;padding:7px 10px;background:var(--raised);max-width:100%}
input[type=color]{width:56px;height:36px;padding:2px;background:var(--raised);border:1px solid var(--line2);border-radius:6px;cursor:pointer}
::placeholder{color:var(--muted)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}
.uid{background:var(--raised);padding:6px 10px;border-radius:6px;border:1px solid var(--line);word-break:break-all}
button.linkish{background:none;border:0;color:var(--link);padding:2px 0;text-decoration:underline}
.btn{display:inline-block;padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:600;white-space:nowrap}
a.btn.pri{background:var(--steel);color:#fff}
.livest{font-size:.9rem;color:var(--muted)}
.livest.bad{color:var(--loss);font-weight:600}
body.site .only-offline{display:none}
tr.wonrow td{background:color-mix(in srgb,var(--win-bg) 14%,transparent)}

/* side rail */
body.site{--railw:248px}
body.site header.top{position:fixed;top:0;bottom:0;left:0;width:var(--railw);flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:24px;padding:22px 18px;border-right:1px solid var(--line);overflow-y:auto;z-index:20}
.wm{display:flex;gap:10px;align-items:center;color:var(--ink);text-decoration:none}
.wm b{display:block;font-family:var(--head);font-size:1.08rem;letter-spacing:.02em;line-height:1.1}
.wm small{display:block;color:var(--muted);font-size:.82rem;margin-top:3px}
.mark{color:var(--ink);flex:none}
.railbody{display:flex;flex-direction:column;gap:22px;flex:1}
.railnav{display:flex;flex-direction:column;gap:2px}
.railnav a{padding:8px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:600;border-left:3px solid transparent}
.railnav a:hover{color:var(--ink);background:var(--card)}
.railnav a.on{color:var(--ink);background:var(--card);border-left-color:var(--accent)}
.railorg{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;font-size:.95rem}
.railorg p{margin:0 0 8px;color:var(--muted)}
.railorg .who{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px;font-size:.85rem}
.railorg button.pri{width:100%;padding:8px}
.burger{display:none}
body.site main{max-width:none;margin:0 0 0 var(--railw);padding:36px clamp(18px,4vw,56px) 90px}
.wrap{max-width:1120px;margin:0 auto}
.wrap h1{font-size:clamp(1.7rem,3.4vw,2.3rem);line-height:1.12;margin:0 0 14px}

/* home */
.hero2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:32px;align-items:center;padding:6px 0 44px}
.hero2 h1{font-size:clamp(1.9rem,3.7vw,2.8rem);line-height:1.08;margin:0 0 16px}
.lede{font-size:1.15rem;line-height:1.5;max-width:56ch;margin:0 0 6px}
.search{display:flex;gap:8px;margin:22px 0 10px;max-width:560px}
.search input{flex:1;min-width:0;font-size:1.1rem;padding:12px 14px;border-radius:8px}
.search button{padding:0 22px;border-radius:8px;font-weight:600}
.bracket-art{width:100%;height:auto}
.b-lines{fill:none;stroke:var(--line2);stroke-width:2;stroke-linecap:round}
.b-final{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.b-dot{fill:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .b-lines{stroke-dasharray:1;animation:tt-draw 1.7s ease-out both}
  .b-final,.b-dot{animation:tt-fade .5s 1.5s ease-out both}
}
@keyframes tt-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes tt-fade{from{opacity:0}to{opacity:1}}
.block{padding:30px 0;border-top:1px solid var(--line)}
.block h2{font-size:1.5rem;margin:0 0 16px}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 48px;margin:0}
.feat dt{font-weight:700;font-size:1.1rem;margin-bottom:4px}
.feat dd{margin:0;color:var(--muted);max-width:52ch;line-height:1.5}
.cta{display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta h2{margin-bottom:6px}
.cta p{margin:0;color:var(--muted);max-width:56ch}
.foot{margin-top:34px}

/* tournament list */
.tlist{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-bottom:12px}
.trow{display:grid;grid-template-columns:44px minmax(0,1.5fr) minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 8px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.trow:hover{background:var(--card)}
.tmark{width:44px;height:44px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:1.3rem}
.tmain{display:flex;flex-direction:column;min-width:0}
.tname{font-size:1.14rem;overflow:hidden;text-overflow:ellipsis}
.tsub{color:var(--muted);font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{display:flex;flex-direction:column;font-size:.92rem}
.tstat{font-weight:600;font-size:.92rem;white-space:nowrap}
.tstat.done{color:var(--muted)}
.tstat.live{color:var(--live);display:inline-flex;gap:6px;align-items:center}
.tstat i{width:8px;height:8px;border-radius:50%;background:var(--live)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin:6px 0 18px}
.seg button{border:0;border-radius:0;background:transparent;padding:7px 16px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* organiser */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:44px;align-items:start}
.authbox{display:flex;flex-direction:column;gap:12px}
.authbox .seg{margin:0 0 4px;align-self:flex-start}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pagehead h1{margin:0}
.orgrow{justify-content:space-between;align-items:center;padding:4px 0}

/* a tournament's own page */
.tour{--gold:var(--accent);--gold-l:color-mix(in srgb,var(--accent) 16%,transparent)}
.tourbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line)}
.tourbar nav.tabs{margin-left:0;gap:0}
.tourbar nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:10px 16px;font-weight:600;color:var(--muted)}
.tourbar nav.tabs button:hover{color:var(--ink)}
.tourbar nav.tabs button.on{background:transparent;color:var(--ink);border-bottom-color:var(--accent)}
.tourbar .livest{margin-left:auto}
.tour .hero{border:1px solid var(--line)}

@media (max-width:860px){
  body.site header.top{position:sticky;top:0;bottom:auto;width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  body.site main{margin-left:0;padding:22px 16px 70px}
  .burger{display:inline-flex;margin-left:auto}
  .railbody{display:none;width:100%;gap:14px}
  body.menu .railbody{display:flex}
  .railorg{margin-top:0}
  .hero2{grid-template-columns:minmax(0,1fr);gap:12px}
  .bracket-art{max-width:420px}
  .feat,.two{grid-template-columns:minmax(0,1fr)}
  .trow{grid-template-columns:44px minmax(0,1fr)}
  .trow .tmeta,.trow .tstat{grid-column:2}
  .tourbar nav.tabs{overflow-x:auto;flex-wrap:nowrap;max-width:100%}
  .tourbar nav.tabs button{white-space:nowrap}
}

/* ---------- fixtures: bracket boxes ---------- */
.bk{display:flex;overflow-x:auto;padding-bottom:10px;background:linear-gradient(var(--card) 0 34px,var(--line) 34px 35px,var(--rail) 35px);border:1px solid var(--line);border-radius:10px}
.bkcol{flex:0 0 250px;display:flex;flex-direction:column}
.bkhead{height:35px;box-sizing:border-box;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.bkbody{flex:1;display:flex;flex-direction:column;padding:6px 0}
.bkslot{flex:1;display:flex;align-items:center;position:relative;padding:8px 26px 8px 26px;min-height:76px}
.bk.rnd .bkslot{flex:0 0 auto;min-height:0;padding:6px 14px}
.bk.rnd .bkcol{flex:0 0 260px}
/* connectors (elimination only): arms to the right, joined in pairs, and a stub into the next round */
.bk:not(.rnd) .bkcol:not(.last) .bkslot::after{content:"";position:absolute;right:12px;width:14px;border-color:var(--line2,#6b737c);border-style:solid;border-width:0}
.bk:not(.rnd) .bkcol:not(.last) .bkslot:nth-child(odd)::after{top:50%;bottom:0;border-top-width:2px;border-right-width:2px}
.bk:not(.rnd) .bkcol:not(.last) .bkslot:nth-child(even)::after{top:0;bottom:50%;border-bottom-width:2px;border-right-width:2px}
.bk:not(.rnd) .bkcol:not(.last) .bkslot:only-child::after{bottom:auto;border-right-width:0;width:26px;right:0}
.bk:not(.rnd) .bkcol:not(.first) .bkslot::before{content:"";position:absolute;left:-12px;width:38px;top:50%;border-top:2px solid var(--line2,#6b737c)}
.bk:not(.rnd) .bkcol:not(.last) .bkslot{padding-right:26px}
.bx{width:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.25);transition:border-color .12s,transform .12s}
.bx:hover{border-color:var(--accent)}
.bx.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.bx.isbye{cursor:default;opacity:.55}
.bx.ghost{visibility:hidden}
.bxl{font-size:.72rem;color:var(--muted);padding:2px 8px;border-bottom:1px solid var(--line)}
.bxr{display:flex;align-items:stretch;height:30px;border-top:1px solid var(--line)}
.bxr:first-of-type,.bxl+.bxr{border-top:0}
.bxs{flex:0 0 24px;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted);background:var(--raised);border-right:1px solid var(--line)}
.bxn{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:0 8px;font-weight:600}
.bxn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bxn img{width:20px;height:20px;border-radius:4px;object-fit:cover;flex:0 0 auto}
.bxr.tbd .bxn{color:var(--muted);font-weight:500;font-style:italic}
.bxsc{flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--raised);border-left:1px solid var(--line);font-variant-numeric:tabular-nums}
.bxr.won .bxsc{background:var(--accent);color:var(--accent-ink,#1b1b1b)}
.bxr.won .bxn{color:var(--ink)}

<script id="tt-app">
"use strict";
/* ============ Tourney Tracker: blank, reusable tournament tracker ============
   Everything (players, tournaments, stages, results, images) lives in one save:
   kept in this browser (IndexedDB, with automatic backups) and exportable as a .json file. */
const APP_VERSION = '1.2';
const LIVE = window.TT_VIEW ? null : (window.TT_LIVE || null);   // site mode: many tournaments stored online
let VIEW = !!window.TT_VIEW || !!LIVE;     // read-only (published page, or the public site until an organiser logs in)
const CIVS = ["Armenians","Aztecs","Bengalis","Berbers","Bohemians","Britons","Bulgarians","Burgundians","Burmese","Byzantines","Celts","Chinese","Cumans","Danes","Dravidians","Ethiopians","Franks","Georgians","Goths","Gurjaras","Hindustanis","Huns","Incas","Italians","Japanese","Jurchens","Khitans","Khmer","Koreans","Lithuanians","Magyars","Malay","Malians","Mapuche","Mayans","Mongols","Muisca","Persians","Poles","Portuguese","Romans","Saracens","Saxons","Shu","Sicilians","Slavs","Spanish","Tatars","Teutons","Tupi","Turks","Varangians","Vietnamese","Vikings","Wei","Wu"];
const TYPES = {
  rr:    {name:'Round robin',        help:'Everyone plays everyone in their group, once or twice.'},
  swiss: {name:'Swiss',              help:'Set number of rounds. Each round pairs people on the same score, no rematches. Tiebreak: Buchholz (sum of opponents\' points).'},
  elim:  {name:'Single elimination', help:'Knockout bracket, seeded from an earlier stage, the ladder or by hand. Byes for top seeds if the bracket isn\'t full.'},
  single:{name:'Single games',       help:'One-off games you add by hand (show matches, tiebreakers, FFAs as A v B, etc.).'},
  spoon: {name:'Wooden Spoon',       help:'One series between the bottom two of a stage or the ladder.'}
};
const ENT = {players:'Players (1v1)', teams:'Teams (from the Teams list)', rotate:'Rotating partners (team games, new partners each game)'};

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o));
const fmtDate = d => { if(!d) return ''; const x = new Date(d+'T00:00:00'); return isNaN(x)?d:x.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); };
const dates = T => T.start ? (T.end && T.end!==T.start ? `${fmtDate(T.start)} – ${fmtDate(T.end)}` : fmtDate(T.start)) : '';
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }
function rng(seed){ let s = 0; for(const c of String(seed)) s = (s*31 + c.charCodeAt(0))>>>0; return ()=>{ s = (s*1664525+1013904223)>>>0; return s/4294967296; }; }

/* ---------- storage: IndexedDB (big enough for images), localStorage fallback ---------- */
const DBN = 'tourney-tracker', KEY = 'state', BKEY = 'backups';
let db = null;
function idb(){ return new Promise((res,rej)=>{ try{ const r = indexedDB.open(DBN,1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
function idbGet(k){ return new Promise((res,rej)=>{ const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
function idbSet(k,v){ return new Promise((res,rej)=>{ const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function load(){
  try{ db = await idb(); const s = await idbGet(KEY); if(s) return JSON.parse(s); }catch(e){ db = null; }
  try{ const s = localStorage.getItem('tt-'+KEY); if(s) return JSON.parse(s); }catch(e){}
  return null;
}
let saveTimer = null, lastBackup = 0;
function noSave(on){ let b = document.getElementById('nosave'); if(on && !b){ b = document.createElement('div'); b.id = 'nosave'; b.className = 'nosave';
  b.textContent = 'This preview can\'t save. Changes are lost when it closes. Open the file from your PC (double-click it) to keep your work, or use Save / load › Save file.'; document.body.prepend(b); } else if(!on && b) b.remove(); }
function save(){ if(VIEW) return; clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 250); }
async function doSave(){
  saveTimer = null;
  const json = JSON.stringify(state);
  if(LIVE){ liveSave(); return; }
  try{
    if(db){ await idbSet(KEY, json);
      if(Date.now()-lastBackup > 5*60*1000){ await addBackup(json, 'auto'); }
    } else localStorage.setItem('tt-'+KEY, json);
    noSave(false);
  }catch(e){ noSave(true); }
}
async function addBackup(json, why){
  if(!db) return; lastBackup = Date.now();
  const list = (await idbGet(BKEY)) || [];
  list.unshift({t:Date.now(), why, size:json.length, json});
  while(list.length>20) list.pop();
  await idbSet(BKEY, list);
}

/* ---------- state ---------- */
let state = null;
const ui = { tab:'home', stage:null, setup:'event', open:{} };
function blankState(){ return {app:'tourney-tracker', v:1, players:{}, porder:[], tours:[], cur:null}; }
function newTour(name){ return {id:uid(), name:name||'New tournament', sub:'', start:'', end:'', place:'', prize:'', org:'', logo:'', banner:'', gallery:[], links:[], docs:[], roster:[], teams:[], stages:[], civLimit:0, notes:'', created:Date.now()}; }
function newStage(type){
  const n = TYPES[type].name;
  return {id:uid(), name:n, type, ent:'players', k:2, rotGames:0, legs:1, groups:1, gmap:{}, bo:1, boFinal:0, pts:1, ladder: (type==='rr'||type==='swiss'||type==='single'),
          maps:[], seedFrom:'manual', perGroup:2, size:4, third:false, rounds:3, manualSeeds:[], locked:null, entrants:null, matches:[],
          playAll:false, div:'', tb:null, manual:{}, neutralFirst:true};
}
const T = () => (state && state.tours.find(t=>t.id===state.cur)) || null;
const P = id => state.players[id] || {name:'?'};

/* ---------- entrants: 'p:<playerId>' or 't:<teamId>' ---------- */
function teamOf(T_, id){ return T_.teams.find(t=>t.id===id); }
function entName(k, T_=T()){ if(!k) return 'TBD'; const [kind,id] = k.split(':'); if(kind==='p') return P(id).name; const t = teamOf(T_,id); return t ? t.name : '?'; }
function entPhoto(k, T_=T()){ if(!k) return ''; const [kind,id] = k.split(':'); if(kind==='p') return P(id).photo||''; const t = teamOf(T_,id); return (t&&t.logo)||''; }
function entMembers(k, T_=T()){ if(!k) return []; const [kind,id] = k.split(':'); if(kind==='p') return [id]; const t = teamOf(T_,id); return t ? t.members.slice() : []; }
function chip(k, T_=T()){ if(!k) return `<span class="chip tbd">TBD</span>`; const ph = entPhoto(k,T_);
  return `<span class="chip">${ph?`<img src="${ph}" alt="">`:''}${esc(entName(k,T_))}</span>`; }
function sideHtml(side, T_=T()){ if(side===null) return `<span class="chip tbd">bye</span>`; if(!side||!side.length) return chip(null); return `<span class="side">${side.map(k=>chip(k,T_)).join(' ')}</span>`; }
function stageEntrants(S, T_=T()){
  if(S.ent==='teams'){ const all = T_.teams.map(t=>'t:'+t.id); return S.entrants ? S.entrants.filter(k=>all.includes(k)) : all; }
  const all = T_.roster.map(id=>'p:'+id); return S.entrants ? S.entrants.filter(k=>all.includes(k)) : all;
}

/* ---------- series results ---------- */
const need = bo => Math.floor(bo/2)+1;
function score(m){ const s=[0,0]; (m.games||[]).forEach(g=>{ if(g.w===0||g.w===1) s[g.w]++; }); return s; }
function matchBo(S,m){ return m.bo || S.bo || 1; }
/* returns 0 / 1 for the winning side, or null. A bye (one side null) goes straight to the other side. */
function winnerOf(S, m, sides){ sides = sides || sidesOf(S,m);
  if(sides[0]===null && sides[1]) return 1; if(sides[1]===null && sides[0]) return 0;
  if(!sides[0]||!sides[1]) return null;
  const s = score(m), bo = matchBo(S,m);
  if(S.playAll && !m.bo){ if(s[0]+s[1] < bo) return null; return s[0]>s[1] ? 0 : s[1]>s[0] ? 1 : null; }   // play all N: every map is played
  const n = need(bo); return s[0]>=n ? 0 : s[1]>=n ? 1 : null; }
function isBye(S,m){ const sd = sidesOf(S,m); return sd[0]===null || sd[1]===null; }

/* ---------- schedules ---------- */
function circle(list){ const a = list.slice(); if(a.length%2) a.push(null); const n = a.length, out = [];
  for(let r=0;r<n-1;r++){ const pr = []; for(let i=0;i<n/2;i++){ const x=a[i], y=a[n-1-i]; if(x!=null&&y!=null) pr.push((r%2&&i===0)?[y,x]:[x,y]); } out.push(pr); a.splice(1,0,a.pop()); }
  return out; }
function groupsOf(S, E){ const n = Math.max(1, Math.min(S.groups||1, Math.floor(E.length/2)||1)); const g = Array.from({length:n},()=>[]);
  E.forEach((k,i)=>{ let gi = S.gmap && S.gmap[k]!=null ? S.gmap[k] : null; if(gi==null||gi>=n){ const r = Math.floor(i/n), c = i%n; gi = r%2 ? n-1-c : c; } g[gi].push(k); });   // snake by entry order
  return g; }
const GL = i => String.fromCharCode(65+i);
function combos(arr,k){ const out=[]; const rec=(s,acc)=>{ if(acc.length===k){ out.push(acc.slice()); return; } for(let i=s;i<arr.length;i++){ acc.push(arr[i]); rec(i+1,acc); acc.pop(); } }; rec(0,[]); return out; }
function rotateGames(E, k, G, seed){
  const r = rng(seed), cands = [];
  combos(E, 2*k).forEach(c=>{ combos(c.slice(1), k-1).forEach(rest=>{ const A=[c[0],...rest], B=c.filter(x=>!A.includes(x)); cands.push([A,B]); }); });
  const play = {}, part = {}, opp = {}, kk=(a,b)=>a<b?a+'|'+b:b+'|'+a, out=[];
  for(let g=0; g<G && cands.length; g++){
    let best=null, bs=Infinity;
    for(const c of cands){ let s = 0; const all=[...c[0],...c[1]];
      all.forEach(p=>s += (play[p]||0)*12);
      c.forEach(t=>{ for(let i=0;i<t.length;i++) for(let j=i+1;j<t.length;j++){ const v=part[kk(t[i],t[j])]||0; s+=v*v*8; } });
      c[0].forEach(a=>c[1].forEach(b=>{ const v=opp[kk(a,b)]||0; s+=v*v*2; }));
      s += r()*0.5; if(s<bs){ bs=s; best=c; } }
    out.push(best); const all=[...best[0],...best[1]]; all.forEach(p=>play[p]=(play[p]||0)+1);
    best.forEach(t=>{ for(let i=0;i<t.length;i++) for(let j=i+1;j<t.length;j++) part[kk(t[i],t[j])]=(part[kk(t[i],t[j])]||0)+1; });
    best[0].forEach(a=>best[1].forEach(b=>opp[kk(a,b)]=(opp[kk(a,b)]||0)+1));
  }
  // pack into rounds: nobody plays twice in a round
  const rounds = []; out.forEach(gm=>{ const ps=[...gm[0],...gm[1]]; let rd = rounds.find(R=>R.every(x=>![...x[0],...x[1]].some(p=>ps.includes(p)))); if(!rd){ rd=[]; rounds.push(rd); } rd.push(gm); });
  return rounds;
}
function defaultRotGames(n,k){ const pairs = n*(n-1)/2, per = 2*(k*(k-1)/2); return Math.max(1, Math.ceil(pairs/per)); }
function generate(S){
  const T_ = T(), E = stageEntrants(S,T_); S.matches = []; S.locked = null;
  if(S.type==='rr'){
    if(S.ent==='rotate'){
      if(E.length < 2*S.k) return `Need at least ${2*S.k} players for ${S.k}v${S.k}.`;
      const G = S.rotGames || defaultRotGames(E.length,S.k);
      rotateGames(E, S.k, G, S.id).forEach((rd,ri)=>rd.forEach((gm,mi)=>S.matches.push({id:uid(), r:ri+1, g:0, sides:[gm[0],gm[1]], games:[]})));
    } else {
      if(E.length<2) return 'Need at least 2 entrants.';
      groupsOf(S,E).forEach((grp,gi)=>{ const base = circle(grp);
        for(let leg=0; leg<(S.legs||1); leg++) base.forEach((rd,ri)=>rd.forEach(m=>S.matches.push({id:uid(), r:leg*base.length+ri+1, g:gi, sides: leg%2?[[m[1]],[m[0]]]:[[m[0]],[m[1]]], games:[]}))); });
    }
  } else if(S.type==='elim'){
    const size = Math.max(2, S.size||4); let B = 1; while(B<size) B*=2;
    let order=[1,2]; while(order.length<B){ const n=order.length*2; order = order.flatMap(s=>[s, n+1-s]); }
    const R = Math.log2(B);
    for(let r=1;r<=R;r++){ const cnt = B/2**r;
      for(let i=0;i<cnt;i++){ const id = `e${r}_${i}`, spec = r===1 ? [{seed:order[2*i]},{seed:order[2*i+1]}] : [{win:`e${r-1}_${2*i}`},{win:`e${r-1}_${2*i+1}`}];
        S.matches.push({id, r, spec, games:[], label: roundName(r,R), bo: (r===R && S.boFinal) ? S.boFinal : 0}); } }
    if(S.third && R>=2) S.matches.push({id:'e3rd', r:R, spec:[{lose:`e${R-1}_0`},{lose:`e${R-1}_1`}], games:[], label:'3rd place'});
  } else if(S.type==='spoon'){
    S.matches.push({id:'spoon', r:1, spec:[{bottom:1},{bottom:0}], games:[], label:'Wooden Spoon'});
  } else if(S.type==='swiss'){
    if(E.length<2) return 'Need at least 2 entrants.';
  }
  return null;
}
function roundName(r,R){ const left = R-r; return left===0?'Final':left===1?'Semi-final':left===2?'Quarter-final':`Round of ${2**(left+1)}`; }

/* ---------- Swiss pairing ---------- */
function swissPair(S){
  const T_=T(), E = stageEntrants(S,T_), st = standings(S), rank = st.map(r=>r.k), r = (S.matches.reduce((a,m)=>Math.max(a,m.r),0))+1;
  if(r>S.rounds) return 'All rounds are paired.';
  if(S.matches.some(m=>winnerOf(S,m)==null)) return 'Finish this round first.';
  const played = new Set(S.matches.filter(m=>m.sides[1]).map(m=>[m.sides[0][0],m.sides[1][0]].sort().join('|')));
  const hadBye = new Set(S.matches.filter(m=>m.sides[1]===null).map(m=>m.sides[0][0]));
  let list = r===1 ? E.slice().sort(()=>0).map(x=>x) : rank.filter(k=>E.includes(k));
  if(r===1){ const rr = rng(S.id); list = E.slice().map(k=>[rr(),k]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]); }
  let bye = null;
  if(list.length%2){ for(let i=list.length-1;i>=0;i--) if(!hadBye.has(list[i])){ bye=list[i]; break; } if(bye==null) bye=list[list.length-1]; list = list.filter(k=>k!==bye); }
  const pairUp = l => { if(!l.length) return []; const a=l[0]; for(let i=1;i<l.length;i++){ const b=l[i]; if(played.has([a,b].sort().join('|'))) continue; const rest = pairUp(l.filter((x,j)=>j!==0&&j!==i)); if(rest) return [[a,b],...rest]; } return null; };
  let pairs = pairUp(list); let rematch = false;
  if(!pairs){ pairs=[]; for(let i=0;i<list.length;i+=2) pairs.push([list[i],list[i+1]]); rematch = true; }
  pairs.forEach(p=>S.matches.push({id:uid(), r, g:0, sides:[[p[0]],[p[1]]], games:[]}));
  if(bye) S.matches.push({id:uid(), r, g:0, sides:[[bye],null], games:[]});
  return rematch ? 'Paired, but a rematch could not be avoided.' : null;
}

/* ---------- standings ---------- */
const TB = {pts:'Series wins (points)', bh:'Buchholz (sum of opponents\' points)', md:'Map difference', nw:'Neutral maps won', h2h:'Head-to-head', gw:'Maps won', manual:'Manual order (e.g. micro challenge)'};
const tbOf = S => (S.tb && S.tb.length) ? S.tb : (S.type==='swiss' ? ['pts','bh','md','h2h'] : ['pts','h2h','md','gw']);
function blankRow(k){ return {k, pl:0, w:0, l:0, pts:0, gw:0, gl:0, bh:0, nw:0, man:0}; }
const pickOf = (S,g,i) => g.pick!=null ? g.pick : (S.neutralFirst && i===0 ? 'n' : '');
function results(S){ const res = []; S.matches.forEach(m=>{ const sd = sidesOf(S,m), w = winnerOf(S,m,sd); if(w!=null) res.push({m,w,sd}); }); return res; }
function standings(S, T_=T()){
  if(S.type==='elim'||S.type==='spoon') return [];
  const rows = {}; stageEntrants(S,T_).forEach(k=>rows[k]=blankRow(k));
  const res = results(S);
  res.forEach(({m,w,sd})=>{ const sc = score(m);
    sd.forEach((side,si)=>{ if(!side) return; side.forEach(k=>{ const r = rows[k] || (rows[k]=blankRow(k)); r.pl++; if(si===w){ r.w++; r.pts += +S.pts||0; } else r.l++; r.gw += sc[si]; r.gl += sc[1-si];
      (m.games||[]).forEach((g,i)=>{ if(g.w===si && pickOf(S,g,i)==='n') r.nw++; }); }); }); });
  Object.values(rows).forEach(r=>{ r.man = +((S.manual||{})[r.k])||0; });
  if(S.type==='swiss') Object.values(rows).forEach(r=>{ r.bh = 0; S.matches.forEach(m=>{ if(!m.sides[1]) return; const si = m.sides[0].includes(r.k)?0:m.sides[1].includes(r.k)?1:-1; if(si<0) return; m.sides[1-si].forEach(o=>r.bh += (rows[o]||{pts:0}).pts); }); });
  return rankRows(Object.values(rows), res, tbOf(S));
}
function rankRows(list, res, tb){
  const h2h = (a,b) => res.reduce((s,x)=>{ const ia = x.sd.findIndex(sd=>sd&&sd.includes(a)), ib = x.sd.findIndex(sd=>sd&&sd.includes(b)); return (ia>=0&&ib>=0&&ia!==ib&&x.w===ia) ? s+1 : s; },0);
  const val = {pts:r=>r.pts, bh:r=>r.bh, md:r=>r.gw-r.gl, nw:r=>r.nw, gw:r=>r.gw, manual:r=>r.man};
  const cmp = (a,b) => { for(const k of tb){ const d = k==='h2h' ? h2h(b.k,a.k)-h2h(a.k,b.k) : (val[k]?val[k](b)-val[k](a):0); if(d) return d; } return 0; };
  list.sort((a,b)=> cmp(a,b) || entName(a.k).localeCompare(entName(b.k)));
  let pos = 0; list.forEach((r,i)=>{ if(i===0 || cmp(list[i-1],r)!==0) pos = i+1; r.pos = pos; });
  return list;
}
function groupStandings(S){ const all = standings(S); if(S.type!=='rr'||S.ent==='rotate'||(S.groups||1)<2) return [all];
  const res = results(S); return groupsOf(S, stageEntrants(S)).map(g=>rankRows(all.filter(r=>g.includes(r.k)).map(r=>({...r})), res, tbOf(S))); }
/* overall ladder: sum of 'counts toward ladder' stages in one division, separately for players and for teams */
const divs = (T_=T()) => [...new Set(T_.stages.map(S=>S.div||''))];
function ladderStages(kind, div, T_=T()){ return T_.stages.filter(S=>S.ladder && ['rr','swiss','single'].includes(S.type) && ((kind==='t')===(S.ent==='teams')) && (div==null || (S.div||'')===div)); }
function ladder(kind, T_=T(), div=''){
  const rows = {}, res = [], st = ladderStages(kind, div, T_);
  st.forEach(S=>{ standings(S,T_).forEach(r=>{ const x = rows[r.k] || (rows[r.k]=blankRow(r.k)); ['pl','w','l','pts','gw','gl','bh','nw','man'].forEach(f=>x[f]+=r[f]); }); res.push(...results(S)); });
  if(kind==='p' && st.length) T_.roster.forEach(id=>{ if(!rows['p:'+id] && !st.some(S=>S.entrants)) rows['p:'+id]=blankRow('p:'+id); });
  return rankRows(Object.values(rows), res, st.length===1 ? tbOf(st[0]) : ['pts','h2h','md','gw']);
}
function hasLadder(kind, T_=T(), div=''){ return ladderStages(kind, div, T_).length>0; }

/* ---------- seeding / elimination sides ---------- */
function seedSource(S, T_=T()){
  const src = S.seedFrom;
  if(src==='manual'){ const E = stageEntrants(S,T_); const ms = (S.manualSeeds||[]).filter(k=>E.includes(k)); return [...ms, ...E.filter(k=>!ms.includes(k))]; }
  if(src==='ladderP') return ladder('p',T_,S.div||'').map(r=>r.k);
  if(src==='ladderT') return ladder('t',T_,S.div||'').map(r=>r.k);
  const from = T_.stages.find(x=>x.id===src); if(!from) return [];
  if(from.type==='elim') return placings(from,T_).map(p=>p.k);
  const g = groupStandings(from); if(g.length<2) return g[0].map(r=>r.k);
  const per = S.type==='spoon' ? 99 : (S.perGroup||2), out = [];
  for(let rank=0; rank<per; rank++) g.forEach(grp=>{ if(grp[rank]) out.push(grp[rank].k); });   // A1 B1 C1.. A2 B2.. so 1v4 = A1 v B2
  return out;
}
function entrantsFor(S, T_=T()){ return S.locked || seedSource(S,T_); }
function sidesOf(S, m, T_=T()){
  if(!m.spec) return m.sides;
  const E = entrantsFor(S,T_), size = S.type==='elim' ? Math.max(2,S.size||4) : 2;
  return m.spec.map(sp=>{
    if(sp.seed!=null) return sp.seed<=size ? (E[sp.seed-1] ? [E[sp.seed-1]] : []) : null;
    if(sp.bottom!=null){ const k = E[E.length-1-sp.bottom]; return k ? [k] : []; }
    const f = S.matches.find(x=>x.id===(sp.win||sp.lose)); if(!f) return [];
    const fs = sidesOf(S,f,T_); const w = winnerOf(S,f,fs);
    if(sp.win){ if(fs[0]===null&&fs[1]===null) return null; return w==null ? [] : fs[w]; }
    if(w==null) return []; const l = fs[1-w]; return l===null ? null : l;
  });
}
function placings(S, T_=T()){   // elimination stage: [{k, place}]
  const out = [], seen = new Set(), R = S.matches.reduce((a,m)=>Math.max(a,m.r),0);
  const add = (side,place)=>{ (side||[]).forEach(k=>{ if(!seen.has(k)){ seen.add(k); out.push({k,place}); } }); };
  const fin = S.matches.find(m=>m.r===R && m.id!=='e3rd');
  if(fin){ const sd = sidesOf(S,fin,T_), w = winnerOf(S,fin,sd); if(w!=null){ add(sd[w],1); add(sd[1-w],2); } }
  const third = S.matches.find(m=>m.id==='e3rd');
  if(third){ const sd = sidesOf(S,third,T_), w = winnerOf(S,third,sd); if(w!=null){ add(sd[w],3); add(sd[1-w],4); } }
  for(let r=R-1;r>=1;r--){ const place = 2**(R-r)+1; S.matches.filter(m=>m.r===r).forEach(m=>{ const sd = sidesOf(S,m,T_), w = winnerOf(S,m,sd); if(w!=null && sd[1-w]) add(sd[1-w], (third&&r===R-1)?3:place); }); }
  return out;
}
function lockIfNeeded(S){ if((S.type==='elim'||S.type==='spoon') && !S.locked) S.locked = seedSource(S).slice(); }

/* ---------- tournament summary ---------- */
function allMatches(T_=T()){ return T_.stages.flatMap(S=>S.matches.map(m=>({S,m}))); }
const inDiv = (S,div) => div==null || (S.div||'')===div;
function progress(T_=T(), div=null){ let done=0, total=0; allMatches(T_).forEach(({S,m})=>{ if(!inDiv(S,div)) return; const sd = sidesOf(S,m,T_); if(sd[0]===null||sd[1]===null) return; total++; if(winnerOf(S,m,sd)!=null) done++; });
  T_.stages.filter(S=>S.type==='swiss' && inDiv(S,div)).forEach(S=>{ const paired = S.matches.reduce((a,m)=>Math.max(a,m.r),0); const per = Math.floor(stageEntrants(S,T_).length/2); total += Math.max(0,S.rounds-paired)*per; });
  return {done,total}; }
function finalResult(T_=T(), div=''){
  const res = {champ:null, ru:null, third:null, spoon:null};
  const sp = T_.stages.find(S=>S.type==='spoon' && S.matches.length && inDiv(S,div));
  if(sp){ const m = sp.matches[0], sd = sidesOf(sp,m,T_), w = winnerOf(sp,m,sd); if(w!=null) res.spoon = sd[1-w]; }
  const el = T_.stages.filter(S=>S.type==='elim' && inDiv(S,div));
  const last = el[el.length-1];

function byeHtml(S,m){ const sd = sidesOf(S,m); const k = sd[0]||sd[1]; return `<div class="match done small muted">${k&&k.length?sideHtml(k):'–'} <span>bye</span></div>`; }

/* ---------- Standings ---------- */
function pageStandings(){

  divs(t).forEach(dv=>{ const fr = finalResult(t,dv), D = dv?esc(dv)+' · ':'';
    if(dv) out += `<h2 style="margin-top:14px">${esc(dv)}</h2>`;
    if(fr.champ) out += `<div class="card"><h3>${D}Final placings</h3>${finalTable(t,dv)}</div>`;
    const many = st => st.length>1;
    if(hasLadder('t',t,dv) && many(ladderStages('t',dv,t))) out += `<div class="card"><h3>${D}Team ladder</h3><div class="small muted">All team stages marked “counts toward ladder”.</div>${ladderTable(ladder('t',t,dv))}</div>`;
    if(hasLadder('p',t,dv) && many(ladderStages('p',dv,t))) out += `<div class="card"><h3>${D}Player ladder</h3><div class="small muted">All player stages marked “counts toward ladder”.</div>${ladderTable(ladder('p',t,dv))}</div>`;
  t.stages.filter(S=>(S.div||'')===dv).forEach(S=>{
    if(S.type==='elim'){ const pl = placings(S,t); if(pl.length) out += `<div class="card"><h3>${esc(S.name)}</h3><table>${pl.map(p=>`<tr><td>${ord(p.place)}</td><td>${chip(p.k)}</td></tr>`).join('')}</table></div>`; return; }
    if(S.type==='spoon') return;
    const g = groupStandings(S);
    out += `<div class="card"><h3>${esc(S.name)}</h3><div class="small muted">Ties: ${tbOf(S).map(k=>esc(TB[k])).join(' › ')}</div>${g.map((rows,gi)=>`${g.length>1?`<h3 class="small" style="margin-top:8px">Group ${GL(gi)}</h3>`:''}${ladderTable(rows, S)}`).join('')}</div>`;
  }); });
  const civ = civStats(t); if(civ) out += civ;
  return out || `<div class="card empty">No results yet.</div>`;
}
const ord = n => n + (['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
function finalOrder(t, dv=''){
  const fr = finalResult(t,dv), out = [], seen = new Set(), kind = (t.stages.find(S=>S.type==='elim'&&inDiv(S,dv))||{}).ent==='teams' || hasLadder('t',t,dv) ? 't' : 'p';
  const el = t.stages.filter(S=>S.type==='elim' && S.matches.length && inDiv(S,dv)).pop();
  if(el) placings(el,t).forEach(p=>{ if(!seen.has(p.k)){ seen.add(p.k); out.push(p); } });
  const spoonSide = fr.spoon ? fr.spoon : [];
  const sp = t.stages.find(S=>S.type==='spoon' && S.matches.length && inDiv(S,dv)); let spoonWin = [];
  if(sp){ const m=sp.matches[0], sd=sidesOf(sp,m,t), w=winnerOf(sp,m,sd); if(w!=null) spoonWin = sd[w]; }
  const rest = (hasLadder(kind,t,dv) ? ladder(kind,t,dv).map(r=>r.k) : []).filter(k=>!seen.has(k) && !spoonSide.includes(k) && !spoonWin.includes(k));
  let n = out.length ? Math.max(...out.map(p=>p.place)) : 0;
  rest.forEach(k=>{ n++; out.push({k, place:n}); seen.add(k); });
  spoonWin.forEach(k=>{ if(!seen.has(k)){ n++; out.push({k,place:n}); seen.add(k); } });
  spoonSide.forEach(k=>{ if(!seen.has(k)){ n++; out.push({k,place:n,spoon:true}); seen.add(k); } });
  return out;
}
function finalTable(t,dv){ return `<table>${finalOrder(t,dv).map(p=>`<tr><td>${p.place===1?'🏆 ':''}${ord(p.place)}${p.spoon?' 🥄':''}</td><td>${chip(p.k,t)}</td><td class="muted small">${p.k.startsWith('t:')?entMembers(p.k,t).map(x=>esc(P(x).name)).join(', '):''}</td></tr>`).join('')}</table>`; }
function civStats(t){ const c = {}; allMatches(t).forEach(({S,m})=>{ const sd = sidesOf(S,m,t); (m.games||[]).forEach(g=>{ if(g.w!==0&&g.w!==1) return; Object.entries(g.civs||{}).forEach(([p,civ])=>{ if(!civ) return; const si = entMembers((sd[0]||[]).find(k=>entMembers(k,t).includes(p))||'',t).length ? 0 : 1; const x = c[civ]||(c[civ]={n:0,w:0}); x.n++; if(si===g.w) x.w++; }); }); });
  const rows = Object.entries(c).sort((a,b)=>b[1].n-a[1].n); if(!rows.length) return '';
  return `<div class="card"><h3>Civs played</h3><div class="tablewrap"><table><tr><th>Civ</th><th class="n">Games</th><th class="n">Won</th><th class="n">Win %</th></tr>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${v.w}</td><td class="n">${Math.round(100*v.w/v.n)}%</td></tr>`).join('')}</table></div></div>`; }

/* ---------- Players: stats ---------- */
function playerStats(id, t){
  const st = {id, w:0, l:0, gw:0, gl:0, civs:{}, maps:{}, list:[], team:null};
  const k = 'p:'+id; st.team = t.teams.find(x=>x.members.includes(id)) || null;
  allMatches(t).forEach(({S,m})=>{ const sd = sidesOf(S,m,t); if(!sd[0]||!sd[1]||!sd[0].length||!sd[1].length) return;
    const si = sd.findIndex(side=>side.some(e=>entMembers(e,t).includes(id))); if(si<0) return;
    const w = winnerOf(S,m,sd), sc = score(m);
    if(w!=null){ if(w===si) st.w++; else st.l++; }
    (m.games||[]).forEach(g=>{ if(g.w!==0&&g.w!==1) return; const c = (g.civs||{})[id];
      if(!c && Object.values(g.civs||{}).some(Boolean)) return;   // civs entered for this map but not this player = sat out (team sub)
      const won = g.w===si; if(won) st.gw++; else st.gl++; if(c){ const x = st.civs[c]||(st.civs[c]={n:0,w:0}); x.n++; if(won) x.w++; }
      if(g.map){ const x = st.maps[g.map]||(st.maps[g.map]={n:0,w:0}); x.n++; if(won) x.w++; } });
    st.list.push({S, m, si, sd, w, sc}); });
  st.place = null; divs(t).forEach(dv=>{ if(!finalResult(t,dv).champ) return; const f = finalOrder(t,dv).find(p=>p.k===k || entMembers(p.k,t).includes(id)); if(f) st.place = f; });
  return st;
}
const pct = (w,n) => n ? Math.round(100*w/n)+'%' : '–';
function wlTable(obj, label){ const rows = Object.entries(obj).sort((a,b)=>b[1].n-a[1].n||b[1].w-a[1].w); if(!rows.length) return `<div class="muted small">None recorded yet.</div>`;
  return `<table><tr><th>${label}</th><th class="n">Games</th><th class="n">Won</th><th class="n">Win %</th></tr>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${v.w}</td><td class="n">${pct(v.w,v.n)}</td></tr>`).join('')}</table>`; }
function pagePlayers(){
  const t = T();
  if(ui.player && t.roster.includes(ui.player)) return playerProfile(ui.player, t);
  if(!t.roster.length) return `<div class="card empty">No players in this tournament yet.${VIEW?'':' Add them under <b>Setup › Players</b>.'}</div>`;
  const all = t.roster.map(id=>playerStats(id,t)).sort((a,b)=>(a.place?a.place.place:99)-(b.place?b.place.place:99) || (b.w-b.l)-(a.w-a.l) || (b.gw-b.gl)-(a.gw-a.gl) || P(a.id).name.localeCompare(P(b.id).name));
  const fin = all.some(x=>x.place);
  return `<div class="card"><h3>Players</h3><div class="small muted">Click a player for their full stats.</div><div class="tablewrap"><table><tr><th>Player</th>${t.teams.length?'<th>Team</th>':''}<th class="n">Series W–L</th><th class="n">Maps W–L</th><th class="n">Map win %</th><th>Most played civ</th>${fin?'<th class="n">Finish</th>':''}</tr>
    ${all.map(x=>{ const top = Object.entries(x.civs).sort((a,b)=>b[1].n-a[1].n)[0];
      return `<tr style="cursor:pointer" data-act="player" data-v="${x.id}"><td>${chip('p:'+x.id,t)}</td>${t.teams.length?`<td class="small">${x.team?esc(x.team.name)+(x.team.cap===x.id?' (c)':''):''}</td>`:''}<td class="n">${x.w}–${x.l}</td><td class="n">${x.gw}–${x.gl}</td><td class="n">${pct(x.gw,x.gw+x.gl)}</td><td class="small">${top?esc(top[0])+` (${top[1].n})`:''}</td>${fin?`<td class="n">${x.place?ord(x.place.place):''}</td>`:''}</tr>`; }).join('')}</table></div></div>`;
}
function playerProfile(id, t){
  const p = P(id), x = playerStats(id,t);
  const at = {ev:0, w:0, l:0, gw:0, gl:0, titles:[]};   // all-time across every tournament in this save
  state.tours.forEach(o=>{ if(!o.roster.includes(id)) return; at.ev++; const y = playerStats(id,o); at.w+=y.w; at.l+=y.l; at.gw+=y.gw; at.gl+=y.gl;
    divs(o).forEach(dv=>{ const fr = finalResult(o,dv); if((fr.champ||[]).some(k=>entMembers(k,o).includes(id))) at.titles.push(o.name+(dv?' ('+dv+')':'')); }); });
  const games = x.list.map(({S,m,si,sd,w,sc})=>`<tr><td class="small">${esc(S.name)}<div class="muted">${esc(matchLabel(S,m))}</div></td><td>${sideHtml(sd[1-si])}</td><td class="n">${sc[si]}–${sc[1-si]}</td><td>${w==null?'<span class="muted small">to play</span>':w===si?'<b style="color:var(--win)">Won</b>':'<span style="color:var(--loss)">Lost</span>'}</td></tr>`).join('');
  return `<p><button class="sm" data-act="player" data-v="">‹ All players</button></p>
    <div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${p.photo?`<img src="${p.photo}" alt="" style="width:110px;height:110px;border-radius:50%;object-fit:cover">`:''}
      <div><h2 style="margin:0">${esc(p.name)}</h2><div class="muted">${x.team?esc(x.team.name)+(x.team.cap===id?' · captain':''):''}${x.place?` · finished ${ord(x.place.place)}`:''}</div>
      ${p.pid?`<div class="small"><a href="https://www.aoe2insights.com/user/${encodeURIComponent(p.pid)}/" target="_blank" rel="noopener">AoE2 Insights</a> · <a href="https://www.aoe2companion.com/players/${encodeURIComponent(p.pid)}" target="_blank" rel="noopener">aoe2companion</a></div>`:''}${replayAvg(id,t)}</div></div>
    <div class="grid g3">
      <div class="card"><b class="muted small">SERIES</b><div style="font-size:1.6rem;font-weight:700">${x.w}–${x.l}</div></div>
      <div class="card"><b class="muted small">MAPS</b><div style="font-size:1.6rem;font-weight:700">${x.gw}–${x.gl} <span class="small muted">${pct(x.gw,x.gw+x.gl)}</span></div></div>
      <div class="card"><b class="muted small">ALL-TIME (${at.ev} event${at.ev===1?'':'s'})</b><div style="font-size:1.2rem;font-weight:700">${at.w}–${at.l} series · ${at.gw}–${at.gl} maps</div>${at.titles.length?`<div class="small">🏆 ${at.titles.map(esc).join(', ')}</div>`:''}</div></div>
    <div class="grid g2"><div class="card"><h3>Civs</h3>${wlTable(x.civs,'Civ')}</div><div class="card"><h3>Maps</h3>${wlTable(x.maps,'Map')}</div></div>
    <div class="card"><h3>Matches</h3>${games?`<div class="tablewrap"><table><tr><th>Stage</th><th>Against</th><th class="n">Maps</th><th></th></tr>${games}</table></div>`:'<div class="muted">None yet.</div>'}</div>`;
}
/* ---------- History ---------- */
function pageHistory(){
  const tours = state.tours.slice().sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  const rows = tours.flatMap(t=>divs(t).map(dv=>{ const fr = finalResult(t,dv), pr = progress(t,dv); return `<tr><td><b>${esc(t.name)}</b>${dv?` <span class="badge">${esc(dv)}</span>`:''}<div class="small muted">${esc(dates(t))}</div></td><td>${fr.champ?sideHtml(fr.champ,t):`<span class="muted small">${pr.total?`${pr.done}/${pr.total} played`:'not started'}</span>`}</td><td>${fr.ru?sideHtml(fr.ru,t):''}</td><td>${fr.spoon?sideHtml(fr.spoon,t):''}</td></tr>`; })).join('');
  // all-time per player: titles (incl. as a team member), runner-ups, spoons, series and games
  const at = {};
  const A = id => at[id] || (at[id] = {t:0, ru:0, sp:0, ev:0, w:0, l:0, gw:0, gl:0});
  tours.forEach(t=>{ t.roster.forEach(id=>A(id).ev++);
    const mem = side => (side||[]).flatMap(k=>entMembers(k,t));
    divs(t).forEach(dv=>{ const fr = finalResult(t,dv); mem(fr.champ).forEach(id=>A(id).t++); mem(fr.ru).forEach(id=>A(id).ru++); mem(fr.spoon).forEach(id=>A(id).sp++); });
    allMatches(t).forEach(({S,m})=>{ const sd = sidesOf(S,m,t), w = winnerOf(S,m,sd); if(w==null||!sd[0]||!sd[1]) return; const sc = score(m);
      sd.forEach((side,si)=>mem(side).forEach(id=>{ const a = A(id); if(si===w) a.w++; else a.l++; a.gw+=sc[si]; a.gl+=sc[1-si]; })); }); });
  const list = Object.entries(at).filter(([id])=>state.players[id]).sort((a,b)=>b[1].t-a[1].t || b[1].ru-a[1].ru || (b[1].w-b[1].l)-(a[1].w-a[1].l));
  return `<div class="card"><h3>Tournaments</h3>${rows?`<div class="tablewrap"><table><tr><th>Tournament</th><th>Champion</th><th>Runner-up</th><th>🥄 Spoon</th></tr>${rows}</table></div>`:'<div class="muted">None yet.</div>'}</div>
    <div class="card"><h3>All-time</h3><div class="small muted">Across every tournament in this save. Team wins count for every team member.</div>${list.length?`<div class="tablewrap"><table><tr><th>Player</th><th class="n">Events</th><th class="n">🏆</th><th class="n">2nd</th><th class="n">🥄</th><th class="n">Series W–L</th><th class="n">Games W–L</th></tr>
      ${list.map(([id,a])=>`<tr><td>${chip('p:'+id)}</td><td class="n">${a.ev}</td><td class="n">${a.t||''}</td><td class="n">${a.ru||''}</td><td class="n">${a.sp||''}</td><td class="n">${a.w}–${a.l}</td><td class="n">${a.gw}–${a.gl}</td></tr>`).join('')}</table></div>`:'<div class="muted">No results yet.</div>'}</div>`;
}

async function fillBackups(){ const el = $('#bk'); if(!el) return; if(!db){ el.textContent = 'Not available in this browser.'; return; }
  const list = (await idbGet(BKEY)) || [];
  el.innerHTML = list.length ? `<table>${list.map((b,i)=>{ let n=''; try{ const s = JSON.parse(b.json); n = s.tours.map(x=>x.name).join(', '); }catch(e){}
    return `<tr><td>${new Date(b.t).toLocaleString()}</td><td class="small muted">${esc(b.why)} · ${esc(n)} · ${Math.round(b.size/1024)} KB</td><td><button class="sm" data-act="restore" data-i="${i}">Restore</button></td></tr>`; }).join('')}</table>` : 'None yet.'; }


/* ---------- in-page dialogs (browser pop-ups are blocked in previews / sandboxes) ---------- */
function dialog(msg, opts={}){ return new Promise(res=>{
  const w = document.createElement('div'); w.className = 'modal';
  w.innerHTML = `<div class="mbox"><div style="white-space:pre-wrap">${esc(msg)}</div>${opts.input!=null?`<input type="text" style="width:100%;margin-top:10px" value="${esc(opts.input)}">`:''}
    <div class="row" style="justify-content:flex-end;margin-top:14px">${opts.cancel?`<button data-r="0">Cancel</button>`:''}<button class="pri" data-r="1">${esc(opts.ok||'OK')}</button></div></div>`;
  document.body.appendChild(w); const inp = w.querySelector('input'); (inp||w.querySelector('[data-r="1"]')).focus(); if(inp) inp.select();
  const done = ok => { w.remove(); res(opts.input!=null ? (ok ? inp.value.trim() : null) : ok); };
  w.addEventListener('click', e=>{ const b = e.target.closest('[data-r]'); if(b){ e.stopPropagation(); done(b.dataset.r==='1'); } else if(e.target===w && opts.cancel) done(false); });
  w.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); done(true); } if(e.key==='Escape' && opts.cancel) done(false); });
}); }
const askText = (msg, def='') => dialog(msg, {input:def, cancel:true});
const askYes = msg => dialog(msg, {cancel:true, ok:'Yes'});
const say = msg => dialog(msg, {});

/* ============ actions ============ */
function curStage(id){ return T().stages.find(s=>s.id===id); }
function curMatch(sid,mid){ const S = curStage(sid); return [S, S && S.matches.find(m=>m.id===mid)]; }
function pickFile(accept, multiple){ return new Promise(res=>{ const f = $('#filepick'); f.value=''; f.accept = accept; f.multiple = !!multiple; f.onchange = ()=>res([...f.files]); f.click(); }); }
function readURL(file){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function readText(file){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsText(file); }); }
async function shrink(file, max, type='image/jpeg', q=.85){
  const url = await readURL(file); if(/svg/.test(file.type)) return url;
  const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload=()=>res(i); i.onerror=()=>{ say(`“${file.name}” couldn't be opened as an image. If it's a shortcut, pick the actual image file (PNG, JPG, GIF or WebP).`); rej(new Error('not an image')); }; i.src=url; });
  const s = Math.min(1, max/Math.max(img.width,img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL(type, q);
}
function download(name, text, type){ const b = new Blob([text],{type}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
const slug = s => (s||'tournament').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_') || 'tournament';
function validState(s){ return s && s.app==='tourney-tracker' && Array.isArray(s.tours) && s.players; }

async function act(el, ev){
  const a = el.dataset.act, d = el.dataset, t = T();
  if(LIVE && await siteAct(a, d, el)) return;
  switch(a){
    case 'tab': ui.tab = d.v; ui.player = null; ui.team = null; break;
    case 'stage': ui.stage = d.v; ui.mopen = null; break;
    case 'mgo': ui.tab = 'fixtures'; ui.stage = d.s; ui.mopen = d.m; render(); { const p = document.getElementById('mpanel'); if(p) p.scrollIntoView({block:'nearest'}); } return;
    case 'mopen': ui.mopen = ui.mopen===d.m ? null : d.m; render(); if(ui.mopen){ const p = document.getElementById('mpanel'); if(p) p.scrollIntoView({behavior:'smooth', block:'nearest'}); } return;
    case 'setup': ui.setup = d.v; break;
    case 'player': ui.player = d.v || null; window.scrollTo(0,0); render(); return;
    case 'switch': if(el.value==='__new'){ const n = await askText('Tournament name?','New tournament'); if(n){ const x = newTour(n); state.tours.push(x); state.cur = x.id; ui.tab='setup'; ui.setup='event'; } } else state.cur = el.value; break;
    case 'newtour': { const n = await askText('Tournament name?','New tournament'); if(!n) return; const x = newTour(n); state.tours.push(x); state.cur = x.id; ui.tab='setup'; ui.setup='event'; break; }
    case 'duptour': { const x = clone(t); x.id = uid(); x.name = t.name+' (copy)'; x.created = Date.now(); x.stages.forEach(S=>{ S.matches = []; S.locked = null; }); state.tours.push(x); state.cur = x.id; toast('Copied – results cleared'); break; }
    case 'deltour': if(!await askYes(`Delete "${t.name}" and all its results? A backup stays under Save / load.`)) return; await addBackup(JSON.stringify(state),'before delete'); state.tours = state.tours.filter(x=>x!==t); state.cur = state.tours[0] ? state.tours[0].id : null; ui.tab='home'; break;
    /* images & docs */
    case 'imgadd': { const [f] = await pickFile('image/*'); if(!f) return; t[d.f] = await shrink(f, d.f==='banner'?1800:512, d.f==='logo'?'image/png':'image/jpeg', .85); if(t[d.f].length>1.5e6) t[d.f] = await shrink(f, d.f==='banner'?1400:400, 'image/jpeg', .8); await autoTheme(t); break; }
    case 'imgdel': t[d.f] = ''; await autoTheme(t); break;
    case 'galadd': { const fs = await pickFile('image/*', true); for(const f of fs) t.gallery.push(await shrink(f, 1400, 'image/jpeg', .82)); break; }
    case 'galdel': t.gallery.splice(+d.i,1); break;
    case 'linkadd': t.links.push({label:'',url:''}); break;
    case 'linkdel': t.links.splice(+d.i,1); break;
    case 'docadd': { const [f] = await pickFile('.pdf,application/pdf,.txt,.png,.jpg'); if(!f) return; if(f.size>3*1024*1024){ await say('That file is over 3 MB. Put it online (Google Drive, Discord) and add it as a link instead.'); return; } t.docs.push({name:f.name, size:f.size, data: await readURL(f)}); break; }
    case 'docdel': t.docs.splice(+d.i,1); break;
    case 'opendoc': { ev.preventDefault(); const doc = t.docs[+d.i]; const bin = atob(doc.data.split(',')[1]), u8 = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
      const type = (doc.data.match(/^data:([^;]+)/)||[])[1]||'application/octet-stream'; window.open(URL.createObjectURL(new Blob([u8],{type})), '_blank'); return; }
    /* players */
    case 'padd': { const id = uid(); state.players[id] = {id, name:'New player', pid:'', photo:''}; state.porder.push(id); if(t) t.roster.push(id); break; }
    case 'pdel': { const used = state.tours.filter(x=>x.roster.includes(d.p)); if(used.length && !await askYes(`${P(d.p).name} is in ${used.map(x=>x.name).join(', ')}. Remove them from those too?`)) return; if(!used.length && !await askYes(`Delete ${P(d.p).name}?`)) return;
      used.forEach(x=>{ x.roster = x.roster.filter(r=>r!==d.p); x.teams.forEach(tm=>tm.members = tm.members.filter(r=>r!==d.p)); }); delete state.players[d.p]; state.porder = state.porder.filter(x=>x!==d.p); break; }
    case 'pall': if(!t) return; if(d.v==='1'){ state.porder.forEach(id=>{ if(state.players[id] && !t.roster.includes(id)) t.roster.push(id); }); } else { t.roster = []; t.teams.forEach(tm=>tm.members = []); } break;
    case 'pdelall': { const n = state.porder.filter(id=>state.players[id]).length; if(!await askYes(`Delete all ${n} players? They are also taken out of every team.`)) return;
      state.tours.forEach(x=>{ x.roster = []; x.teams.forEach(tm=>tm.members = []); }); state.players = {}; state.porder = []; break; }
    case 'pphoto': { const [f] = await pickFile('image/*'); if(!f) return; state.players[d.p].photo = await shrink(f, 360, 'image/jpeg', .85); break; }
    case 'roster': if(el.checked){ if(!t.roster.includes(el.value)) t.roster.push(el.value); } else { t.roster = t.roster.filter(x=>x!==el.value); t.teams.forEach(tm=>tm.members = tm.members.filter(r=>r!==el.value)); } break;
    case 'bulkadd': { const lines = $('#bulk').value.split(/\n/).map(s=>s.trim()).filter(Boolean); let n=0, up=0;
      lines.forEach(l=>{ const parts = l.split(/\s*[,\t]\s*/), name = parts[0], pid = (()=>{ for(const x of parts.slice(1)){ if(/^\d+$/.test(x)) return x; const mm = x.match(/(?:user|profile|players?)\/(\d+)/i); if(mm) return mm[1]; } return ''; })(); if(!name) return; let id = state.porder.find(x=>state.players[x] && state.players[x].name.toLowerCase()===name.toLowerCase());
        if(!id){ id = uid(); state.players[id] = {id, name, pid, photo:''}; state.porder.push(id); n++; }
        else if(pid && state.players[id].pid!==pid){ state.players[id].pid = pid; up++; }
        if(t && !t.roster.includes(id)) t.roster.push(id); });
      toast(`${n} added${up?`, ${up} profile IDs filled in`:''}`); break; }
    /* teams */
    case 'teamadd': t.teams.push({id:uid(), name:`Team ${t.teams.length+1}`, cap:'', members:[], logo:''}); break;
    case 'teamdel': if(!await askYes(`Delete ${t.teams[+d.i].name}?`)) return; t.teams.splice(+d.i,1); break;
    case 'teammem': { const tm = t.teams[+d.i]; if(el.checked){ t.teams.forEach(o=>o.members = o.members.filter(x=>x!==el.value)); tm.members.push(el.value); } else { tm.members = tm.members.filter(x=>x!==el.value); if(tm.cap===el.value) tm.cap=''; } break; }
    case 'teamlogo': { const [f] = await pickFile('image/*'); if(!f) return; t.teams[+d.i].logo = await shrink(f, 256, 'image/png'); break; }
    /* stages */
    case 'stageadd': { const S = newStage(d.v); if(d.v==='elim'||d.v==='spoon'){ const prev = t.stages.filter(x=>x.type!=='spoon').pop(); if(prev){ S.seedFrom = prev.type==='elim' ? prev.id : prev.id; S.ent = prev.ent==='rotate' ? 'players' : prev.ent; } }
      if(d.v==='spoon'){ const lad = t.stages.find(x=>x.ladder); if(lad) S.seedFrom = lad.ent==='teams'?'ladderT':(lad.ent==='rotate'||t.stages.filter(x=>x.ladder).length>1)?'ladderP':lad.id; S.ent = lad&&lad.ent==='teams'?'teams':'players'; S.bo = 1; }
      const last = t.stages[t.stages.length-1]; if(last) S.div = last.div||''; t.stages.push(S); break; }
    case 'stagedel': { const S = curStage(d.s); if(!await askYes(`Delete stage "${S.name}"${S.matches.length?' and its results':''}?`)) return; t.stages = t.stages.filter(x=>x!==S); break; }
    case 'stageup': { const i = t.stages.findIndex(x=>x.id===d.s); if(i>0) [t.stages[i-1],t.stages[i]] = [t.stages[i],t.stages[i-1]]; break; }
    case 'stageent': { const S = curStage(d.s); const all = S.ent==='teams' ? t.teams.map(x=>'t:'+x.id) : t.roster.map(id=>'p:'+id); let cur = S.entrants ? S.entrants.slice() : all.slice();
      if(el.checked){ if(!cur.includes(el.value)) cur.push(el.value); } else cur = cur.filter(x=>x!==el.value); S.entrants = cur; if(S.type==='elim'){ S.manualSeeds = (S.manualSeeds||[]).filter(x=>cur.includes(x)); } break; }
    case 'stagegrp': { const S = curStage(d.s); S.gmap = S.gmap||{}; S.gmap[d.v] = +el.value; break; }
    case 'seedup': { const S = curStage(d.s); const order = seedSource(S); const i = order.indexOf(d.v); if(i>0){ [order[i-1],order[i]] = [order[i],order[i-1]]; } S.manualSeeds = order; break; }
    case 'gen': { const S = curStage(d.s); const has = S.matches.some(m=>(m.games||[]).some(g=>g.w===0||g.w===1)); if(has && !await askYes(`Remake fixtures for "${S.name}"? Its results will be cleared.`)) return;
      if(has) await addBackup(JSON.stringify(state),'before remake'); const err = generate(S); if(err){ await say(err); return; } ui.tab='fixtures'; ui.stage=S.id; toast(`${S.matches.length} matches made`); break; }
    case 'swiss': { const S = curStage(d.s); const err = swissPair(S); if(err) toast(err); break; }
    case 'unswiss': { const S = curStage(d.s); const r = S.matches.reduce((x,m)=>Math.max(x,m.r),0); const ms = S.matches.filter(m=>m.r===r); if(ms.some(m=>(m.games||[]).length) && !await askYes(`Round ${r} has results. Undo the pairing anyway?`)) return; S.matches = S.matches.filter(m=>m.r!==r); break; }
    case 'mround': { const S = curStage(d.s), m = S.matches.find(x=>x.id===d.m); if(!m) return; m.r = +el.value || m.r;
      const used = [...new Set(S.matches.map(x=>x.r))].sort((a,b)=>a-b); S.matches.forEach(x=>{ x.r = used.indexOf(x.r)+1; }); break; }
    case 'swset': { const S = curStage(d.s), m = S.matches.find(x=>x.id===d.m), i = +d.v, k = el.value; if(!m || !m.sides[i]) return; const old = m.sides[i][0]; if(old===k) return;

    case 'manual': { const S = curStage(d.s); S.manual = S.manual||{}; S.manual[d.v] = +el.value||0; break; }
    case 'tbup': { const S = curStage(d.s); const tb = tbOf(S).slice(), i = tb.indexOf(d.v); if(i>0) [tb[i-1],tb[i]] = [tb[i],tb[i-1]]; S.tb = tb; break; }
    case 'tbdel': { const S = curStage(d.s); S.tb = tbOf(S).filter(k=>k!==d.v); if(!S.tb.length) S.tb = ['pts']; break; }
    case 'tbadd': { const S = curStage(d.s); S.tb = [...tbOf(S), d.v]; break; }
    case 'gpick': { const [S,m] = curMatch(d.s,d.m); const i = +d.i; m.games[i] = m.games[i]||{}; m.games[i].pick = el.value; break; }
    case 'mapadd': { const S = curStage(d.s), inp = document.getElementById('mapin-'+d.s); const v = (inp.value||'').trim(); if(!v) return;
      if(!S.maps.some(x=>x.toLowerCase()===v.toLowerCase())) S.maps.push(v); ui.focus = 'mapin-'+d.s; break; }
    case 'mapdel': { const S = curStage(d.s); S.maps.splice(+d.i,1); break; }
    case 'mapclear': { const S = curStage(d.s); if(!await askYes(`Clear all ${S.maps.length} maps from ${S.name}?`)) return; S.maps = []; break; }
    case 'mapcopy': { const S = curStage(d.s), from = curStage(el.value); if(!from) return; from.maps.forEach(m=>{ if(!S.maps.includes(m)) S.maps.push(m); }); break; }
    case 'lock': { const S = curStage(d.s); S.locked = seedSource(S).slice(); break; }
    case 'unlock': { const S = curStage(d.s); S.locked = null; break; }
    case 'addsingle': { const S = curStage(d.s); const side = x => [...document.querySelectorAll(`input[data-sg="${x}"]:checked`)].map(i=>i.value);
      const A = side('A'), B = side('B'); if(!A.length||!B.length) { await say('Tick at least one on each side.'); return; } if(A.some(x=>B.includes(x))){ await say('Someone is on both sides.'); return; }
      S.matches.push({id:uid(), r:S.matches.length+1, g:0, sides:[A,B], games:[], label:$('#sg-label').value.trim()||`Game ${S.matches.length+1}`, bo:+$('#sg-bo').value}); break; }

    case 'gwin': { const [S,m] = curMatch(d.s,d.m); lockIfNeeded(S); const i = +d.i, v = +d.v; m.games[i] = m.games[i]||{}; m.games[i].w = m.games[i].w===v ? null : v;
      const bo = matchBo(S,m); if(winnerOf(S,m)!=null && !(S.playAll && !m.bo)) m.games = m.games.slice(0, Math.max(i+1, m.games.findIndex((g,j)=>{ const s=[0,0]; m.games.slice(0,j+1).forEach(x=>{ if(x&&(x.w===0||x.w===1)) s[x.w]++; }); return s[0]>=need(bo)||s[1]>=need(bo); })+1));
      break; }
    case 'gclear': { const [S,m] = curMatch(d.s,d.m); m.games.splice(+d.i); break; }
    case 'gmap': { const [S,m] = curMatch(d.s,d.m); const i = +d.i; m.games[i] = m.games[i]||{}; m.games[i].map = el.value; break; }
    case 'rmap': { const [S,m] = curMatch(d.s,d.m); const i = +d.i; const used = m.games.filter((g,j)=>j!==i && g && g.map).map(g=>g.map); const pool = S.maps.filter(x=>!used.includes(x)); const pick = (pool.length?pool:S.maps)[Math.floor(Math.random()*(pool.length||S.maps.length))]; m.games[i] = m.games[i]||{}; m.games[i].map = pick; toast(pick); break; }
    case 'gciv': { const [S,m] = curMatch(d.s,d.m); const i = +d.i; m.games[i] = m.games[i]||{}; m.games[i].civs = m.games[i].civs||{}; m.games[i].civs[d.p] = el.value; break; }
    /* files */
    case 'savefile': { const s = JSON.stringify(state); download(`tourney-save-${new Date().toISOString().slice(0,10)}.json`, s, 'application/json'); await addBackup(s,'saved file'); return; }
    case 'openfile': { const [f] = await pickFile('.json,application/json'); if(!f) return; try{ const s = JSON.parse(await readText(f)); if(!validState(s)) throw 0; if(state.tours.length && !await askYes(LIVE ? 'Replace this tournament with the one in the file?' : 'Replace everything in this browser with this file? (A backup is kept.)')) return; await addBackup(JSON.stringify(state),'before open'); state = s; if(LIVE){ s.tours = (s.tours.filter(x=>x.id===s.cur)[0] ? [s.tours.filter(x=>x.id===s.cur)[0]] : s.tours.slice(0,1)); s.cur = s.tours[0] ? s.tours[0].id : null; } ui.tab='home'; toast('Opened'); }catch(e){ await say('That isn\'t a Tourney Tracker save file.'); return; } break; }
    case 'importtour': { const [f] = await pickFile('.json,application/json'); if(!f) return; try{ const s = JSON.parse(await readText(f)); if(!validState(s)) throw 0;
        Object.values(s.players).forEach(p=>{ if(!state.players[p.id]){ const same = state.porder.find(x=>state.players[x].pid && state.players[x].pid===p.pid); if(same){ s.tours.forEach(x=>remapPlayer(x,p.id,same)); } else { state.players[p.id]=p; state.porder.push(p.id); } } });
        s.tours.forEach(x=>{ if(state.tours.find(y=>y.id===x.id)) x.id = uid(); state.tours.push(x); state.cur = x.id; }); toast(`${s.tours.length} tournament(s) added`); }catch(e){ await say('That isn\'t a Tourney Tracker save file.'); return; } break; }
    case 'exportview': exportView(); return;
    case 'gstats': await gameStats(d.mid); return;
    case 'pconf': if(!await pendConfirm(d.mid)) return; break;
    case 'pskip': try{ await pendSet(d.mid, {status:'ignored'}); toast('Left out'); }catch(e){ await say('Could not update: '+(e.code||e.message)); } return;
    case 'restore': { const list = (await idbGet(BKEY))||[]; const b = list[+d.i]; if(!b || !await askYes(`Restore the backup from ${new Date(b.t).toLocaleString()}? What's here now is backed up first.`)) return; await addBackup(JSON.stringify(state),'before restore'); state = JSON.parse(b.json); toast('Restored'); break; }
