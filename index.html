/* ---------- History ---------- */
function pageHistory(){
  const tours = state.tours.slice().sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  const rows = tours.flatMap(t=>divs(t).map(dv=>{ const fr = finalResult(t,dv), pr = progress(t,dv); return `<tr><td><b>${esc(t.name)}</b>${dv?` <span class="badge">${esc(dv)}</span>`:''}<div class="small muted">${esc(dates(t))}</div></td><td>${fr.champ?sideHtml(fr.champ,t):`<span class="muted small">${pr.total?`${pr.done}/${pr.total} played`:'not started'}</span>`}</td><td>${fr.ru?sideHtml(fr.ru,t):''}</td><td>${fr.spoon?sideHtml(fr.spoon,t):''}</td></tr>`; })).join('');
  // all-time per player: titles (incl. as a team member), runner-ups, spoons, series and games
  const at = {};
  const A = id => at[id] || (at[id] = {t:0, ru:0, sp:0, ev:0, w:0, l:0, gw:0, gl:0});
  tours.forEach(t=>{ t.roster.forEach(id=>A(id).ev++);
    const mem = side => (side||[]).flatMap(k=>entMembers(k,t));
    divs(t).forEach(dv=>{ const fr = finalResult(t,dv); mem(fr.champ).forEach(id=>A(id).t++); mem(fr.ru).forEach(id=>A(id).ru++); mem(fr.spoon).forEach(id=>A(id).sp++); });
    allMatches(t).forEach(({S,m})=>{ const sd = sidesOf(S,m,t), w = winnerOf(S,m,sd); if(w==null||!sd[0]||!sd[1]) return; const sc = score(m);
      sd.forEach((side,si)=>mem(side).forEach(id=>{ const a = A(id); if(si===w) a.w++; else a.l++; a.gw+=sc[si]; a.gl+=sc[1-si]; })); }); });
  const list = Object.entries(at).filter(([id])=>state.players[id]).sort((a,b)=>b[1].t-a[1].t || b[1].ru-a[1].ru || (b[1].w-b[1].l)-(a[1].w-a[1].l));
  return `<div class="card"><h3>Tournaments</h3>${rows?`<div class="tablewrap"><table><tr><th>Tournament</th><th>Champion</th><th>Runner-up</th><th>🥄 Spoon</th></tr>${rows}</table></div>`:'<div class="muted">None yet.</div>'}</div>
    <div class="card"><h3>All-time</h3><div class="small muted">Across every tournament in this save. Team wins count for every team member.</div>${list.length?`<div class="tablewrap"><table><tr><th>Player</th><th class="n">Events</th><th class="n">🏆</th><th class="n">2nd</th><th class="n">🥄</th><th class="n">Series W–L</th><th class="n">Games W–L</th></tr>
      ${list.map(([id,a])=>`<tr><td>${chip('p:'+id)}</td><td class="n">${a.ev}</td><td class="n">${a.t||''}</td><td class="n">${a.ru||''}</td><td class="n">${a.sp||''}</td><td class="n">${a.w}–${a.l}</td><td class="n">${a.gw}–${a.gl}</td></tr>`).join('')}</table></div>`:'<div class="muted">No results yet.</div>'}</div>`;
}

/* ---------- in-page dialogs (browser pop-ups are blocked in previews / sandboxes) ---------- */
function dialog(msg, opts={}){ return new Promise(res=>{
  const w = document.createElement('div'); w.className = 'modal';
  w.innerHTML = `<div class="mbox"><div style="white-space:pre-wrap">${esc(msg)}</div>${opts.input!=null?`<input type="text" style="width:100%;margin-top:10px" value="${esc(opts.input)}">`:''}
    <div class="row" style="justify-content:flex-end;margin-top:14px">${opts.cancel?`<button data-r="0">Cancel</button>`:''}<button class="pri" data-r="1">${esc(opts.ok||'OK')}</button></div></div>`;
  document.body.appendChild(w); const inp = w.querySelector('input'); (inp||w.querySelector('[data-r="1"]')).focus(); if(inp) inp.select();
  const done = ok => { w.remove(); res(opts.input!=null ? (ok ? inp.value.trim() : null) : ok); };
  w.addEventListener('click', e=>{ const b = e.target.closest('[data-r]'); if(b){ e.stopPropagation(); done(b.dataset.r==='1'); } else if(e.target===w && opts.cancel) done(false); });
  w.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); done(true); } if(e.key==='Escape' && opts.cancel) done(false); });
}); }
const askText = (msg, def='') => dialog(msg, {input:def, cancel:true});
const askYes = msg => dialog(msg, {cancel:true, ok:'Yes'});
const say = msg => dialog(msg, {});

/* ============ actions ============ */
function curStage(id){ return T().stages.find(s=>s.id===id); }
function curMatch(sid,mid){ const S = curStage(sid); return [S, S && S.matches.find(m=>m.id===mid)]; }
function pickFile(accept, multiple){ return new Promise(res=>{ const f = $('#filepick'); f.value=''; f.accept = accept; f.multiple = !!multiple; f.onchange = ()=>res([...f.files]); f.click(); }); }
function readURL(file){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function readText(file){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsText(file); }); }
async function shrink(file, max, type='image/jpeg', q=.85){
  const url = await readURL(file); if(/svg/.test(file.type)) return url;
  const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload=()=>res(i); i.onerror=()=>{ say(`“${file.name}” couldn't be opened as an image. If it's a shortcut, pick the actual image file (PNG, JPG, GIF or WebP).`); rej(new Error('not an image')); }; i.src=url; });
  const s = Math.min(1, max/Math.max(img.width,img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL(type, q);
}
function download(name, text, type){ const b = new Blob([text],{type}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
const slug = s => (s||'tournament').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_') || 'tournament';
function validState(s){ return s && s.app==='tourney-tracker' && Array.isArray(s.tours) && s.players; }

    case 'stageadd': { const S = newStage(d.v); if(d.v==='elim'||d.v==='spoon'){ const prev = t.stages.filter(x=>x.type!=='spoon').pop(); if(prev){ S.seedFrom = prev.type==='elim' ? prev.id : prev.id; S.ent = prev.ent==='rotate' ? 'players' : prev.ent; } }

      const last = t.stages[t.stages.length-1]; if(last) S.div = last.div||''; t.stages.push(S); break; }

    case 'stageup': { const i = t.stages.findIndex(x=>x.id===d.s); if(i>0) [t.stages[i-1],t.stages[i]] = [t.stages[i],t.stages[i-1]]; break; }
    case 'stageent': { const S = curStage(d.s); const all = S.ent==='teams' ? t.teams.map(x=>'t:'+x.id) : t.roster.map(id=>'p:'+id); let cur = S.entrants ? S.entrants.slice() : all.slice();
      if(el.checked){ if(!cur.includes(el.value)) cur.push(el.value); } else cur = cur.filter(x=>x!==el.value); S.entrants = cur; if(S.type==='elim'){ S.manualSeeds = (S.manualSeeds||[]).filter(x=>cur.includes(x)); } break; }

    case 'seedup': case 'seeddn': { const S = curStage(d.s); const order = seedOrder(S,t).slice(), i = order.indexOf(d.v), j = a==='seedup' ? i-1 : i+1; if(i>=0 && j>=0 && j<order.length){ [order[i],order[j]] = [order[j],order[i]]; } seedSet(S,t,order); break; }
    case 'seedelo': { const S = curStage(d.s); const order = seedOrder(S,t).slice(), e = Object.fromEntries(order.map(k=>[k, entElo(k,t)])); order.sort((x,y)=>(e[y]??-1)-(e[x]??-1)); seedSet(S,t,order); toast('Seeded by ranked ELO'); break; }
    case 'swr1': { const S = curStage(d.s); S.r1 = el.value==='seed' ? 'seed' : 'rand'; break; }
    case 'gen': { const S = curStage(d.s); const has = S.matches.some(m=>(m.games||[]).some(g=>g.w===0||g.w===1)); if(has && !await askYes(`Remake fixtures for "${S.name}"? Its results will be cleared.`)) return;
      if(has) await addBackup(JSON.stringify(state),'before remake'); const err = generate(S); if(err){ await say(err); return; } ui.tab='fixtures'; ui.stage=S.id; toast(`${S.matches.length} matches made`); break; }
    case 'swiss': { const S = curStage(d.s); const err = swissPair(S); if(err) toast(err); break; }
    case 'unswiss': { const S = curStage(d.s); const r = S.matches.reduce((x,m)=>Math.max(x,m.r),0); const ms = S.matches.filter(m=>m.r===r); if(ms.some(m=>(m.games||[]).length) && !await askYes(`Round ${r} has results. Undo the pairing anyway?`)) return; S.matches = S.matches.filter(m=>m.r!==r); break; }
    case 'mround': { const S = curStage(d.s), m = S.matches.find(x=>x.id===d.m); if(!m) return; m.r = +el.value || m.r;
      const used = [...new Set(S.matches.map(x=>x.r))].sort((a,b)=>a-b); S.matches.forEach(x=>{ x.r = used.indexOf(x.r)+1; }); break; }
    case 'swset': { const S = curStage(d.s), m = S.matches.find(x=>x.id===d.m), i = +d.v, k = el.value; if(!m || !m.sides[i]) return; const old = m.sides[i][0]; if(old===k) return;
      const other = S.matches.find(x=>x.r===m.r && x.sides && x.sides.some(sd=>sd && sd[0]===k));
      if(other && (other.games||[]).length){ await say('That team already has results in this round. Clear them first.'); render(); return; }
      if(other){ other.sides.forEach(sd=>{ if(sd && sd[0]===k) sd[0] = old; }); } m.sides[i] = [k]; break; }
    case 'admset': case 'admmap': { const [S,m] = curMatch(d.s,d.m); if(!m) return; lockIfNeeded(S); const note = (($('#adm-note')||{}).value||'').trim().slice(0,80);
      admAward(S, m, +d.v, a==='admset', note); toast(a==='admset' ? 'Admin result saved' : 'Admin map saved'); break; }
    case 'admclear': { const [S,m] = curMatch(d.s,d.m); if(!m || !await askYes('Remove the admin result? The maps it filled in are cleared.')) return; admClear(m); break; }
    case 'manual': { const S = curStage(d.s); S.manual = S.manual||{}; S.manual[d.v] = +el.value||0; break; }
    case 'tbup': { const S = curStage(d.s); const tb = tbOf(S).slice(), i = tb.indexOf(d.v); if(i>0) [tb[i-1],tb[i]] = [tb[i],tb[i-1]]; S.tb = tb; break; }
    case 'tbdel': { const S = curStage(d.s); S.tb = tbOf(S).filter(k=>k!==d.v); if(!S.tb.length) S.tb = ['pts']; break; }
    case 'tbadd': { const S = curStage(d.s); S.tb = [...tbOf(S), d.v]; break; }
    case 'gpick': { const [S,m] = curMatch(d.s,d.m); const i = +d.i; m.games[i] = m.games[i]||{}; m.games[i].pick = el.value; break; }
    case 'mapadd': { const S = curStage(d.s), inp = document.getElementById('mapin-'+d.s); const v = (inp.value||'').trim(); if(!v) return;
      if(!S.maps.some(x=>x.toLowerCase()===v.toLowerCase())) S.maps.push(v); ui.focus = 'mapin-'+d.s; break; }
    case 'mapdel': { const S = curStage(d.s); S.maps.splice(+d.i,1); break; }
    case 'mapclear': { const S = curStage(d.s); if(!await askYes(`Clear all ${S.maps.length} maps from ${S.name}?`)) return; S.maps = []; break; }
    case 'mapcopy': { const S = curStage(d.s), from = curStage(el.value); if(!from) return; from.maps.forEach(m=>{ if(!S.maps.includes(m)) S.maps.push(m); }); break; }
    case 'lock': { const S = curStage(d.s); S.locked = seedSource(S).slice(); break; }
    case 'unlock': { const S = curStage(d.s); S.locked = null; break; }
    case 'addsingle': { const S = curStage(d.s); const side = x => [...document.querySelectorAll(`input[data-sg="${x}"]:checked`)].map(i=>i.value);
      const A = side('A'), B = side('B'); if(!A.length||!B.length) { await say('Tick at least one on each side.'); return; } if(A.some(x=>B.includes(x))){ await say('Someone is on both sides.'); return; }
      S.matches.push({id:uid(), r:S.matches.length+1, g:0, sides:[A,B], games:[], label:$('#sg-label').value.trim()||`Game ${S.matches.length+1}`, bo:+$('#sg-bo').value}); break; }
    /* results */
    case 'gwin': { const [S,m] = curMatch(d.s,d.m); lockIfNeeded(S); const i = +d.i, v = +d.v; m.games[i] = m.games[i]||{}; m.games[i].w = m.games[i].w===v ? null : v; delete m.games[i].adm; delete m.games[i].note;
      const bo = matchBo(S,m); if(winnerOf(S,m)!=null && !(S.playAll && !m.bo)) m.games = m.games.slice(0, Math.max(i+1, m.games.findIndex((g,j)=>{ const s=[0,0]; m.games.slice(0,j+1).forEach(x=>{ if(x&&(x.w===0||x.w===1)) s[x.w]++; }); return s[0]>=need(bo)||s[1]>=need(bo); })+1));
      break; }
    case 'gclear': { const [S,m] = curMatch(d.s,d.m); m.games.splice(+d.i); break; }
    case 'gmap': { const [S,m] = curMatch(d.s,d.m); const i = +d.i; m.games[i] = m.games[i]||{}; m.games[i].map = el.value; break; }
    case 'rmap': { const [S,m] = curMatch(d.s,d.m); const i = +d.i; const used = m.games.filter((g,j)=>j!==i && g && g.map).map(g=>g.map); const pool = S.maps.filter(x=>!used.includes(x)); const pick = (pool.length?pool:S.maps)[Math.floor(Math.random()*(pool.length||S.maps.length))]; m.games[i] = m.games[i]||{}; m.games[i].map = pick; toast(pick); break; }
    case 'gciv': { const [S,m] = curMatch(d.s,d.m); const i = +d.i; m.games[i] = m.games[i]||{}; m.games[i].civs = m.games[i].civs||{}; m.games[i].civs[d.p] = el.value; break; }
    /* files */
    case 'savefile': { const s = JSON.stringify(state); download(`tourney-save-${new Date().toISOString().slice(0,10)}.json`, s, 'application/json'); await addBackup(s,'saved file'); return; }
    case 'openfile': { const [f] = await pickFile('.json,application/json'); if(!f) return; try{ const s = JSON.parse(await readText(f)); if(!validState(s)) throw 0; if(state.tours.length && !await askYes(LIVE ? 'Replace this tournament with the one in the file?' : 'Replace everything in this browser with this file? (A backup is kept.)')) return; await addBackup(JSON.stringify(state),'before open'); state = s; if(LIVE){ s.tours = (s.tours.filter(x=>x.id===s.cur)[0] ? [s.tours.filter(x=>x.id===s.cur)[0]] : s.tours.slice(0,1)); s.cur = s.tours[0] ? s.tours[0].id : null; } ui.tab='home'; toast('Opened'); }catch(e){ await say('That isn\'t a Tourney Tracker save file.'); return; } break; }
    case 'importtour': { const [f] = await pickFile('.json,application/json'); if(!f) return; try{ const s = JSON.parse(await readText(f)); if(!validState(s)) throw 0;
        Object.values(s.players).forEach(p=>{ if(!state.players[p.id]){ const same = state.porder.find(x=>state.players[x].pid && state.players[x].pid===p.pid); if(same){ s.tours.forEach(x=>remapPlayer(x,p.id,same)); } else { state.players[p.id]=p; state.porder.push(p.id); } } });
        s.tours.forEach(x=>{ if(state.tours.find(y=>y.id===x.id)) x.id = uid(); state.tours.push(x); state.cur = x.id; }); toast(`${s.tours.length} tournament(s) added`); }catch(e){ await say('That isn\'t a Tourney Tracker save file.'); return; } break; }
    case 'exportview': exportView(); return;
    case 'gstats': await gameStats(d.mid); return;
    case 'pconf': if(!await pendConfirm(d.mid)) return; break;
    case 'pjoin': if(!await pendJoinInto(d.mid)) return; break;
    case 'pskip': try{ await pendSet(d.mid, {status:'ignored'}); toast('Left out'); }catch(e){ await say('Could not update: '+(e.code||e.message)); } return;
    case 'precheck': try{ await pendSet(d.mid, {recheck:true}); toast('Re-check asked: the next game finder run fetches it again'); }catch(e){ await say('Could not update: '+(e.code||e.message)); } return;
    case 'restore': { const list = (await idbGet(BKEY))||[]; const b = list[+d.i]; if(!b || !await askYes(`Restore the backup from ${new Date(b.t).toLocaleString()}? What's here now is backed up first.`)) return; await addBackup(JSON.stringify(state),'before restore'); state = JSON.parse(b.json); toast('Restored'); break; }
    default: return;
  }
  save(); render(); if(ui.tab==='data') fillBackups();
}
function remapPlayer(t, from, to){ t.roster = t.roster.map(x=>x===from?to:x); t.teams.forEach(tm=>{ tm.members = tm.members.map(x=>x===from?to:x); if(tm.cap===from) tm.cap=to; });
  const k1 = 'p:'+from, k2 = 'p:'+to, sw = a => a && a.map(x=>x===k1?k2:x);
  t.stages.forEach(S=>{ S.entrants = sw(S.entrants); S.manualSeeds = sw(S.manualSeeds); S.locked = sw(S.locked); S.matches.forEach(m=>{ if(m.sides) m.sides = m.sides.map(s=>s&&sw(s)); (m.games||[]).forEach(g=>{ if(g.civs && g.civs[from]!=null){ g.civs[to]=g.civs[from]; delete g.civs[from]; } }); }); }); }
function exportView(){
  const t = T(), used = new Set(t.roster); t.teams.forEach(tm=>tm.members.forEach(x=>used.add(x)));
  const players = {}; used.forEach(id=>{ if(state.players[id]) players[id] = state.players[id]; });
  const data = {app:'tourney-tracker', v:1, players, porder:state.porder.filter(id=>players[id]), tours:[t], cur:t.id, exported:Date.now()};
  const css = $('#tt-css').textContent, app = $('#tt-app').textContent;
  const html = `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(t.name)}</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="tt-css">${css}</style></head>
<body><header class="top" id="top"></header><main id="root"></main><div class="toast" id="toast"></div><input type="file" id="filepick" hidden>
<script>window.TT_VIEW = ${JSON.stringify(data).replace(/</g,'\\u003c')};<\/script><script id="tt-app">${app}<\/script></body></html>`;
  download('index.html', html, 'text/html'); toast('index.html saved – upload it to GitHub');
}

/* field edits (text inputs): save on input, re-render on change */
function onField(el, final){
  const t = T(), d = el.dataset; if(!state || !t) return; let touched = true;
  if(d.th){ t.theme = Object.assign({a:'#d4a64a', b:'#6f9bd1'}, t.theme||{}, {[d.th]: el.value}); t.themeCustom = true; }
  else if(d.tf){ t[d.tf] = d.tf==='civLimit' ? Math.max(0, +el.value||0) : el.value; if(d.tf==='name') renderTop(); }
  else if(d.lf){ t.links[+d.link][d.lf] = el.value.trim(); }
  else if(d.pf){ const pv = d.pf==='pid' ? el.value.replace(/\D/g,'') : d.pf==='cc' ? el.value.replace(/[^a-z]/gi,'').slice(0,2).toLowerCase() : el.value; if(d.pf==='cc' && !pv) delete state.players[d.p].cc; else state.players[d.p][d.pf] = pv; }
  else if(d.tmf){ t.teams[+d.team][d.tmf] = el.value; }
  else if(d.sf){ const S = curStage(d.s); let v = el.value;
    if(['bo','boFinal','pts','legs','groups','rounds','size','k','rotGames','perGroup'].includes(d.sf)) v = Math.max(0, +v||0);

/* ============ site mode (Firebase): many tournaments, public pages, organiser accounts ============

     tournaments/<tid>/img/<id>_<n>, /games/<matchId>, /pending/<matchId>, /detector/meta

    const parts = await Promise.all(Array.from({length:n}, (_,i)=>fs.getDoc(fs.doc(d,'tournaments',tid,'img',id+'_'+i))));
    live.imgs[id] = parts.map(p=>p.exists() ? p.data().d : '').join(''); live.stored.add(id); }));

function liveStatus(msg, bad){ live.status = msg; live.bad = !!bad; const el = document.getElementById('livest'); if(el){ el.textContent = msg; el.classList.toggle('bad', !!bad); } }
const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');

/* ---------- boot ---------- */

function parseRoute(){ const h = (location.hash||'#/').replace(/^#\/?/,''), [path, qs] = h.split('?'), [p, id] = path.split('/'), q = new URLSearchParams(qs||'');

/* GoatCounter page views (only when the site config names a GoatCounter code). Pages are #/… routes, so each one is

function gcStart(){ const code = LIVE && LIVE.goatcounter; if(!code || !/^[a-z0-9-]+$/i.test(code)) return;

  if(ui.tab==='fixtures'){ ui.stage = r.a || 'all'; ui.mopen = r.b || null; } else ui.mopen = null; }
function tourHash(){ const t = T(), e = encodeURIComponent; let h = '#/t/'+live.tid;

/* ---------- directory (search) ---------- */
async function loadDir(force){

}

/* ---------- one tournament ---------- */
function openTournament(tid){
  closeTournament(); live.tid = tid; live.loading = true; state = null; live.doc = null; live.lastJson = null; live.lastIdx = null; live.imgs = {}; live.stored = new Set();
  live.admin = false; VIEW = true; ui.tab = live.nextTab || 'home'; live.nextTab = null; ui.stage = null; ui.player = null; ui.setup = 'event'; live.status = '';
  const {fs, d} = live.fb; eloLoad(tid);

}
function closeTournament(){
  if(live.admin && saveTimer){ clearTimeout(saveTimer); saveTimer = null; liveSave(); }    // flush edits before leaving
  if(live.unsubT){ live.unsubT(); live.unsubT = null; } pendListen(false);
  live.tid = null; live.doc = null; state = null; live.admin = false; VIEW = true; live.lastJson = null; live.loading = false;

function computeAdmin(){ const was = live.admin, d = live.doc, u = live.user;
  live.admin = !!(u && d && live.tid && (live.owner || (d.admins||[]).includes(u.uid))); VIEW = !live.admin;
  if(live.admin && live.wantTab){ ui.tab = live.wantTab; live.wantTab = null; }
  if(live.admin!==was) pendListen(live.admin); }
async function snapHandler(snap, tid){
  if(live.tid!==tid || snap.metadata.hasPendingWrites) return;
  live.loading = false;
  const data = snap.exists() ? snap.data() : null; live.doc = data;
  if(data && data.imgs) Object.keys(data.imgs).forEach(id=>live.stored.add(id));
  if(!data){ state = null; computeAdmin(); render(); return; }
  const same = state && data.state === live.lastJson;
  computeAdmin();
  if(same){ if(live.route.page==='t') liveRender(); return; }                    // our own save coming back (or only the organiser list changed)
  if(live.admin && (saveTimer || live.saving)) return;                          // unsaved local edits win; the next save goes up
  try{
    const s = await hydrate(data.state, data.imgs, tid); if(live.tid!==tid) return;
    if(!validState(s)) throw 0;
    const cur = state && state.cur; state = s; if(cur && state.tours.some(t=>t.id===cur)) state.cur = cur; if(!state.cur && state.tours[0]) state.cur = state.tours[0].id;
    state.exported = data.updated && data.updated.toMillis ? data.updated.toMillis() : null;

}
/* re-render for a remote change, but never under someone typing */
function liveRender(){ const a = document.activeElement;

  render(); }

/* ---------- saving (organisers) ---------- */
function summaryOf(st){

  let done = 0, total = 0; try{ allMatches(t).forEach(({S,m})=>{ const sd = sidesOf(S,m,t); if(!sd[0]||!sd[1]) return; total++; if(winnerOf(S,m,sd)!=null) done++; }); }catch(e){}
  const start = t.start||'', end = t.end||'', endMs = Date.parse((end||start||todayStr())+'T00:00:00Z') + (end||start ? 0 : 60*864e5);
  return {name:t.name||'Untitled tournament', nameLower:(t.name||'').toLowerCase(), sub:t.sub||'', start, end, endTs:Math.round(endMs/1000), place:t.place||'', org:t.org||'', prize:t.prize||'',
    teams:(t.teams||[]).length, players:used.size, played:done, total, stages:[...new Set((t.stages||[]).map(s=>TYPES[s.type]?TYPES[s.type].name:s.type))], accent:(t.theme&&t.theme.a)||''};
}
async function liveSave(){
  const tid = live.tid; if(!live.admin || !live.fb || !tid || !state) return;

  live.saving = true; const {fs, d} = live.fb, ref = fs.doc(d,'tournaments',tid);
  try{
    const {json, imgs, blobs} = dehydrate(state), sum = summaryOf(state);
    if(json.length > 1000000) throw new Error('the save is too big for one online record ('+Math.round(json.length/1024)+' KB)');
    for(const [id,v] of Object.entries(blobs)){ if(live.stored.has(id)) continue; liveStatus('Uploading images…');
      for(let i=0;i*CH<v.length;i++) await fs.setDoc(fs.doc(d,'tournaments',tid,'img',id+'_'+i), {d:v.slice(i*CH,(i+1)*CH)});
      live.stored.add(id); live.imgs[id] = v; }
    if(json !== live.lastJson){
      await fs.updateDoc(ref, {state:json, imgs, updated:fs.serverTimestamp(), by:live.user.uid, app:APP_VERSION});
      live.lastJson = json; }
    const si = JSON.stringify(sum);
    if(si !== live.lastIdx){ await fs.setDoc(fs.doc(d,'index',tid), Object.assign({}, sum, {admins:(live.doc&&live.doc.admins)||[live.user.uid], owner:(live.doc&&live.doc.owner)||live.user.uid, updated:fs.serverTimestamp()}), {merge:true}); live.lastIdx = si; live.dirAt = 0; }

async function createTournament(name){

/* ---------- colours from a logo or banner ---------- */

/* the accent darkened until white text on it passes WCAG AA (4.5:1); used for buttons and active tabs with white labels */
const accentDk = hex => { const cw = h => 1.05/(lumOf(h)+.05); if(cw(hex) >= 4.5) return hex; const [h,s,l] = rgb2hsl(...[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16))); let L = l, o = hex; while(cw(o) < 4.6 && L > 0){ L -= .01; o = hsl2hex(h,s,Math.max(0,L)); } return o; };

async function paletteOf(url){
  const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = url; });
  const c = document.createElement('canvas'), W = 64, H = Math.max(8, Math.round(64*img.height/img.width)||64); c.width = W; c.height = Math.min(H, 96); const g = c.getContext('2d'); g.drawImage(img,0,0,c.width,c.height);
  const px = g.getImageData(0,0,c.width,c.height).data, bins = Array.from({length:18}, ()=>({w:0,r:0,g:0,b:0}));
  for(let i=0;i<px.length;i+=4){ if(px[i+3]<200) continue; const [h,s,l] = rgb2hsl(px[i],px[i+1],px[i+2]); if(s<.28 || l<.12 || l>.9) continue;
    const w = s*(1-Math.abs(2*l-1)), k = bins[Math.floor(h/20)%18]; k.w += w; k.r += px[i]*w; k.g += px[i+1]*w; k.b += px[i+2]*w; }
  const top = bins.map((k,i)=>({i,k})).filter(x=>x.k.w>0).sort((a,b)=>b.k.w-a.k.w); if(!top.length) return null;
  const col = k => { const [h,s,l] = rgb2hsl(k.r/k.w, k.g/k.w, k.b/k.w); return [h, Math.min(.85,Math.max(.5,s)), Math.min(.66,Math.max(.5,l))]; };   // readable on the dark pages
  const [h1,s1,l1] = col(top[0].k), second = top.find(x=>{ const d = Math.abs(x.i-top[0].i); return Math.min(d,18-d) >= 2; });
  const [h2,s2,l2] = second ? col(second.k) : [(h1+30)%360, s1*.8, l1];
  return {a:hsl2hex(h1,s1,l1), b:hsl2hex(h2,s2,l2)};
}

function bracketArt(){

  if(live.pubFor !== live.tid){ live.pubFor = live.tid; live.pub = null; const {fs, d} = live.fb, tid = live.tid;

}

async function siteAct(a, d, el){

    case 'logout': await live.fb.au.signOut(live.fb.auth); live.mine = null; live.authMsg = ''; if(live.route.page==='organiser') render(); return true;
    case 'tfilter': live.filter = d.v; render(); return true;
    case 'authmode': live.authMode = d.v; live.authErr = ''; live.authMsg = ''; render(); return true;
    case 'authgoogle': await authGoogle(); return true;
    case 'authreset': await authReset(); return true;
    case 'pwchange': try{ await live.fb.au.sendPasswordResetEmail(live.fb.auth, live.user.email); live.pwMsg = 'Link sent to '+live.user.email+'. Check your inbox (and spam).'; }catch(e){ live.pwMsg = AUTH_ERR[e.code] || 'Could not send the email. Try again in a minute.'; } render(); return true;
    case 'snew': { const n = await askText('Tournament name?', ''); if(n) await createTournament(n); return true; }
    case 'resend': try{ await live.fb.au.sendEmailVerification(live.user); live.authMsg = 'Sent again.'; }catch(e){ live.authMsg = 'Could not send the email yet. Try again in a minute.'; } render(); return true;
    case 'iverified': await live.user.reload(); await live.user.getIdToken(true); live.authMsg = ''; computeAdmin(); render(); return true;
    case 'copyid': try{ await navigator.clipboard.writeText(live.user.uid); toast('Copied'); }catch(e){ const r = document.createRange(); r.selectNodeContents($('#myid')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Press Ctrl+C to copy'); } return true;
    case 'sdel': await deleteTournament(); return true;
    case 'sdiv': ui.sdiv = d.v || ''; render(); return true;
    case 'team': ui.team = d.v || null; window.scrollTo(0,0); render(); return true;
    case 'tplayer': ui.tab = 'players'; ui.player = d.v; ui.team = null; window.scrollTo(0,0); render(); return true;
    case 'ssinline': ui.ssOpen = ui.ssOpen===d.m ? null : d.m; ui.gsOpen = null; render(); { const x = document.querySelector('.mvseries'); if(x && ui.ssOpen) x.scrollIntoView({behavior:'smooth', block:'start'}); } return true;
    case 'gsinline': { const mid = String(d.mid); if(ui.gsOpen===mid){ ui.gsOpen = null; render(); return true; }
      const g = await gsLoad(mid); if(!g){ await say('Replay stats for this game aren\'t available.'); return true; }
      ui.gsOpen = mid; ui.ssOpen = null; render(); const x = document.querySelector(`.mvg[data-mid="${CSS.escape(mid)}"]`); if(x) x.scrollIntoView({behavior:'smooth', block:'start'}); return true; }
    case 'tteam': ui.tab = 'teams'; ui.team = d.v || null; ui.player = null; window.scrollTo(0,0); render(); return true;

   cut = where part 1 dropped: part 1 counts up to it, b from it; k = share of b's counts after the cut;
   w1/w2 = seconds each part counts for (weights for averages) */
function rsParams(la, b){ la = la||0; const ms = +((b&&b.ms)||0), len = tsec(b&&b.len), part = tsec(b&&b.part);
  const save = ms>0 ? ms/1000 : la, shift = ms>0 ? 0 : la, lb = ms>0 ? (part ?? Math.max(0,(len||0)-save)) : (len||0), end = save + lb;
  const w2 = Math.max(0, end - la);
  return {la, save, shift, lb, end: Math.max(end, la), cut: la, k: lb>0 ? Math.min(1, w2/lb) : 1, w1: la, w2}; }
const rsW = (a, b, wa, wb) => a==null ? b : b==null ? a : (wa+wb>0 ? Math.round((a*wa + b*wb)/(wa+wb)) : b);
const rsMax = (a, b) => a==null ? b : b==null ? a : Math.max(a, b);
const rsAdd = (a, b, k) => a==null && b==null ? undefined : (a||0) + Math.round((b||0)*k);
const rsT = (v, by) => { const x = tsec(v); return x==null ? v : mmss(x+by); };
/* the headline numbers (what the tracker save keeps per player) of two parts as one game */
function rsJoinSt(a, b, p){ a = a||{}; b = b||{}; const k = p.k, w1 = p.w1, w2 = p.w2, o = {};
  const early = n => { const x = tsec(a[n]); if(x!=null && x<=p.cut) return a[n]; const y = tsec(b[n]); return y!=null && y+p.shift>p.cut ? rsT(b[n], p.shift) : undefined; };
  ['eapm','apm','milPct','ecoPct','flt'].forEach(n=>{ const v = rsW(a[n], b[n], w1, w2); if(v!=null) o[n] = v; });
  ['peak','fltPk'].forEach(n=>{ const v = rsMax(a[n], b[n]); if(v!=null) o[n] = v; });
  ['vils','mil','tcIdle'].forEach(n=>{ const v = rsAdd(a[n], b[n], k); if(v!=null) o[n] = v; });
  ['feudal','castle','imp'].forEach(n=>{ const v = early(n); if(v) o[n] = v; });
  if(a.opening) o.opening = a.opening; if(a.douche) o.douche = a.douche;
  // TC idle up to the Castle click: part 1's (up to the save) when Castle was clicked before it, else both parts
  const cA = tsec(a.castle); if(cA!=null && cA<=p.cut){ if(a.idleC!=null) o.idleC = a.idleC; } else { const v = rsAdd(a.idleC, b.idleC, k); if(v!=null) o.idleC = v; }
  return o; }
function rsJoinStAll(A, B, p){ const o = {}; new Set([...Object.keys(A||{}), ...Object.keys(B||{})]).forEach(id=>{ o[id] = rsJoinSt((A||{})[id], (B||{})[id], p); }); return o; }

/* the full replay stats of two parts as one game (for the Game stats view) */
function rsJoinFull(A, B, mids){ const p = rsParams(tsec(A.gameTime)||0, {ms:B.restoreMs, part:B.partTime, len:B.gameTime}), k = p.k, w1 = p.w1, w2 = p.w2;
  const cutL = l => (l||[]).filter(e=>{ const x = tsec(e&&e[0]); return x==null || x<=p.cut; });
  const shL = l => (l||[]).filter(e=>{ const x = tsec(e&&e[0]); return x==null || x+p.shift>p.cut; }).map(e=>Array.isArray(e) ? [rsT(e[0], p.shift), ...e.slice(1)] : e);
  const cnt = (x, y) => { const o = {}; new Set([...Object.keys(x||{}), ...Object.keys(y||{})]).forEach(n=>{ o[n] = rsAdd((x||{})[n], (y||{})[n], k); }); return o; };
  const det = (x, y) => { x = x||{}; y = y||{}; const o = {}; new Set([...Object.keys(x), ...Object.keys(y)]).forEach(n=>{ const a = x[n], b = y[n];
      if(/Series$/.test(n)) o[n] = [...(a||[]).slice(0, Math.floor(p.cut/60)), ...(b||[]).slice(Math.max(0, Math.floor((p.cut - p.save)/60)))];
      else if(/Peak$/.test(n)) o[n] = rsMax(a, b);
      else if(/(Pct|Avg)$/.test(n)) o[n] = rsW(a, b, w1, w2);
      else if(typeof (a??b)==='number') o[n] = rsAdd(a, b, k); });
    return o; };
  const one = (sa, sb) => { sa = sa||{}; sb = sb||{}; const s = {};
    s.apm = rsW(sa.apm, sb.apm, w1, w2); s.eapm = rsW(sa.eapm, sb.eapm, w1, w2);
    if(sa.opening) s.opening = sa.opening; if(sa.douche) s.douche = sa.douche;
    ['ages','agesDone'].forEach(n=>{ s[n] = {}; ['Feudal','Castle','Imperial'].forEach(x=>{ const v = (sa[n]||{})[x], t = tsec(v);
      const u = tsec((sb[n]||{})[x]); if(t!=null && t<=p.cut) s[n][x] = v; else if(u!=null && u+p.shift>p.cut) s[n][x] = rsT(sb[n][x], p.shift); }); });
    ['build','techs','eco'].forEach(n=>{ s[n] = [...cutL(sa[n]), ...shL(sb[n])]; });
    s.units = cnt(sa.units, sb.units); ['vils','military','walls'].forEach(n=>{ s[n] = rsAdd(sa[n], sb[n], k); });
    s.resigned = sb.resigned ? rsT(sb.resigned, p.shift) : sa.resigned;
    s.tcIdle = cnt(sa.tcIdle, sb.tcIdle); s.spent = cnt(sa.spent, sb.spent);
    s.floatAvg = rsW(sa.floatAvg, sb.floatAvg, w1, w2); s.floatPeak = rsMax(sa.floatPeak, sb.floatPeak);
    if(sa.detail || sb.detail) s.detail = det(sa.detail, sb.detail);
    if(sb.result) s.result = sb.result;
    return s; };
  const byA = {}; (A.players||[]).forEach(x=>{ byA[String(x.profileId)] = x; });
  const out = Object.assign({}, B, {gameTime: mmss(p.end), realTime: (tsec(A.realTime)!=null && tsec(B.realTime)!=null) ? mmss(tsec(A.realTime) + tsec(B.realTime)*k) : B.realTime,
    players: (B.players||[]).map(x=>Object.assign({}, x, {stats: one((byA[String(x.profileId)]||{}).stats, x.stats)})),
    joined: {mids, at: p.shift ? null : mmss(p.save), drop: mmss(p.cut)}});
  delete out.restoreMs; delete out.partTime; return out; }

/* the other part of a queued game: a queued game or a confirmed fixture game with the same players and map.
   Returns {prev, next}: prev = {q: pending game} or {fx: {S, m, i, g}}, next = {q} or {fx}. */
function rsFixGames(t){ const out = []; t.stages.forEach(S=>S.matches.forEach(m=>(m.games||[]).forEach((g,i)=>{ if(g && g.mid && (g.w===0||g.w===1)) out.push({S,m,i,g}); }))); return out; }
function rsPair(g, list, t){ const key = rsKey(g.players), mp = normMap(g.map), st = g.started||0, r = g.restore||{}, res = {};
  const qs = list.filter(x=>String(x.matchId)!==String(g.matchId) && rsKey(x.players)===key && normMap(x.map)===mp && Math.abs((x.started||0)-st) <= RS_GAP);
  const pq = (r.prev && qs.find(x=>String(x.matchId)===String(r.prev))) || qs.filter(x=>(x.started||0)<st).pop(), nq = qs.find(x=>(x.started||0)>st);
  if(pq) res.prev = {q:pq}; if(nq) res.next = {q:nq};
  if(pq || nq) return res;
  // a confirmed game: by match ID, else the same map with every player on the same civ
  const civs = {}; (g.players||[]).forEach(p=>{ if(p.id) civs[p.id] = p.civ; }); const n = Object.keys(civs).length;
  const like = f => normMap(f.g.map)===mp && n && Object.keys(f.g.civs||{}).length===n && Object.entries(civs).every(([k,v])=>(f.g.civs||{})[k]===v);
  const fx = rsFixGames(t);
  if(r.ms!=null){ const f = fx.find(f=>f.g.mid===String(r.prev||'-')) || fx.find(f=>like(f) && !(f.g.parts||[]).length && f.g.rsMs==null); if(f) res.prev = {fx:f}; }
  else { const f = fx.find(f=>f.g.mid===String(r.later||'-')) || fx.find(f=>like(f) && f.g.rsMs!=null && !(f.g.parts||[]).length); if(f) res.next = {fx:f};
    // no replay (so no restore mark to read): an earlier confirmed game, same map and civs, may be its first part
    else if(!g.stats){ const e = fx.find(f=>like(f) && f.g.mid!==String(g.matchId) && f.g.rsMs==null && !(f.g.parts||[]).length); if(e) res.prev = {fx:e}; } }
  return res; }
/* a game with no replay can't show the "restored from a save" mark. It's a possible restore when an earlier part with the
   same players and map ended at most RS_SOON before it started (gap in minutes; null when the earlier part is already
   confirmed, so its end time isn't known), and civs = every player on the same civ as in the earlier part. Jacob, 22 Nov */
const RS_SOON = 15*60;
function rsMaybe(g, pr){ if(g.stats || !pr.prev) return null; const st = g.started||0;
  const civs = {}; (g.players||[]).forEach(p=>{ civs[String(p.pid ?? p.profileId ?? '')] = p.civ; });
  if(pr.prev.q){ const q = pr.prev.q, end = q.finished || ((q.started||0) + (tsec(q.gameTime)||0)/1.7), gap = st - end;
    if(!(gap > -60 && gap <= RS_SOON)) return null;
    const same = (q.players||[]).length && (q.players||[]).every(p=>p.civ && civs[String(p.pid ?? p.profileId ?? '')]===p.civ);
    return {gap: Math.max(0, Math.round(gap/60)), civs: same}; }
  return {gap: null, civs: true}; }   // a confirmed earlier part was matched on map and every civ
/* what a fixture game keeps from a queued game's last part */
function rsPartOf(g){ const r = g.restore||{}; return {ms: r.ms, part: r.partTime, len: g.gameTime}; }
const rsPartsOf = x => [...((x.parts)||[]), x.mid].filter(Boolean);
/* join an earlier part (a = {st, len, mids}) and a later part (b = {st, len, ms, part}) into fixture-game fields */
function rsJoinFields(a, b){ const p = rsParams(tsec(a.len)||0, b);
  const o = {len: mmss(p.end), st: rsJoinStAll(a.st, b.st, p), parts: a.mids};
  if(b.ms!=null){ o.rsMs = b.ms; } if(b.part) o.plen = b.part; return o; }
const rsTag = g => g && g.parts && g.parts.length ? ` <span class="rstag" title="${esc('Dropped and was restored from a save'+(g.rsMs>0?' at '+mmss(g.rsMs/1000):'')+'. One result, stats joined from '+(g.parts.length+1)+' replays.')}">restored</span>` : '';

/* queue: join a queued earlier part into the confirmed fixture game that is its later part */
async function pendJoinInto(mid){
  const g0 = live.pend.find(x=>String(x.matchId)===String(mid)), t = T(); if(!g0) return false; const g = pendFix(g0), pr = rsPair(g, pendHere(), t);
  const f = pr.next && pr.next.fx; if(!f) return false; const had = f.m.games[f.i], before = JSON.parse(JSON.stringify(had));
  const sumA = {}; g.players.forEach(p=>{ if(p.id && p.sum) sumA[p.id] = p.sum; });
  const b = {st: had.st||{}, len: had.len, ms: had.rsMs, part: had.plen};
  Object.assign(had, rsJoinFields({st:sumA, len:g.gameTime, mids:[String(g.matchId), ...(had.parts||[])]}, b));
  try{ await pendSet(mid, {status:'joined', joined:String(had.mid), fixture:{stage:f.S.id, match:f.m.id, game:f.i}}); }catch(e){ f.m.games[f.i] = before; await say('Could not join: '+(e.code||e.message)); return false; }
  delete live.games[had.mid]; toast('Joined into '+f.S.name+' map '+(f.i+1)+' as one game'); return true; }
/* true when the queued game's first side is the fixture's second side */
function rsFlip(g, S, m, t){ const ps = pendSides(g), sd = sidesOf(S,m,t); if(!ps || !sd[0]) return false; const mem = sd[0].flatMap(k=>entMembers(k,t));
  const on = side => side.filter(p=>p.id && mem.includes(p.id)).length; return on(ps[1]) > on(ps[0]); }
/* Game stats for a joined game: load every part and show them as one game */
async function rsLoad(mid){ const t = T(), f = t && rsFixGames(t).find(f=>f.g.mid===String(mid) && (f.g.parts||[]).length); if(!f) return null;
  const all = rsPartsOf(f.g), raw = await Promise.all(all.map(x=>gsRaw(x)));
  const have = raw.map((g,i)=>[g, all[i]]).filter(x=>x[0]); if(!have.length) return null;
  let g = have[0][0]; for(let i=1;i<have.length;i++) g = rsJoinFull(g, have[i][0], have.slice(0,i+1).map(x=>x[1]));
  if(have.length<all.length) g = Object.assign({}, g, {joinedMissing: all.length-have.length});
  return g; }
/* ---------- Game stats view: players in their in-game colours, names link to player/team pages ----------
   Looks: 'a' scoreboard, 'b' player cards, 'c' timeline. window.GS_LOOK picks one (default below). */
const PCOL = ['#4a7dff','#ff4136','#2ecc40','#ffdc00','#18d4d4','#c45cff','#aab2bb','#ff8c1a'];   // in-game colours, replay colour id 0-7
const PCOLN = ['Blue','Red','Green','Yellow','Teal','Purple','Grey','Orange'];
let GS_LOOK = 'b';
const gsSec = v => { if(v==null||v==='') return null; const p = String(v).split(':').map(Number); return p.some(isNaN) ? null : p.reduce((a,b)=>a*60+b,0); };
const gsMs = v => v==null ? '' : `${Math.floor(v/60)}:${String(Math.round(v)%60).padStart(2,'0')}`;
function gsPid(p){ return Object.keys(state.players).find(k=>String(state.players[k].pid||'')===String(p.profileId)) || null; }
function gsTeamOf(pid){ const t = T(); return pid && t ? (t.teams||[]).find(x=>(x.members||[]).includes(pid)) : null; }
function gsName(p, cls){ const id = gsPid(p), c = PCOL[p.color] || 'var(--ink)', nm = esc(id ? P(id).name : (p.name||'?')), ft = p._fill ? ' <span class="filltag" title="Not on this team: a fill-in">fill-in</span>' : '';
  return (id ? `<a class="gsn ${cls||''}" style="--pc:${c}" data-act="tplayer" data-v="${id}" href="javascript:void 0" title="${PCOLN[p.color]||''} · open ${nm}'s page">${fl(id)}${nm}</a>` : `<span class="gsn ${cls||''}" style="--pc:${c}">${gsFlag(p)}${nm}</span>`) + ft; }
// a replay player who isn't on the roster still gets a flag from the game record (aoe2companion's country code)
function gsFlag(p){ const c = String(p.country||'').toLowerCase(); return /^[a-z]{2}$/.test(c) ? `<img class="flag" src="${FLAG_CDN}${c}.svg" alt="${c.toUpperCase()}" title="${esc(ccName(c))}" loading="lazy">` : ''; }
// opening text; a TC "douche" (own TC deleted in Dark/Feudal, new one placed by an enemy TC) gets its details on hover
function gsOpen(s){ const ds = s.douche, o = esc(s.opening||''); if(!Array.isArray(ds) || !ds.length) return o;
  const tip = ds.map(d=>`Deleted own TC at ${d.deleted} (${d.age} Age), new TC placed at ${d.built} ${d.in_range?'in range of':'near'} ${d.target||'an enemy'}'s TC (${d.dist} tiles apart)`).join('\n');
  return `<span class="gsdouche${ds.some(d=>d.in_range)?' hot':''}" title="${esc(tip)}">${o}</span>`; }
/* a side's team is the one most of its players are on; anyone else on the side is marked as a fill-in (p._fill) */
function gsTeams(g){ const by = {}; g.players.forEach(p=>(by[p.team] = by[p.team]||[]).push(p));
  return Object.values(by).map(ps=>{ const n = {}; ps.forEach(p=>{ const x = gsTeamOf(gsPid(p)); if(x) n[x.id] = (n[x.id]||0)+1; });
    const top = Object.keys(n).sort((a,b)=>n[b]-n[a])[0], tm = top ? (T().teams||[]).find(x=>x.id===top) : null, won = ps.some(p=>p.won);
    ps.forEach(p=>{ p._fill = !!tm && !(tm.members||[]).includes(gsPid(p)); });
    return {ps, tm, won, name: tm ? tm.name : 'Team '+ps[0].team}; }).sort((a,b)=>b.won-a.won); }
function gsTeamHead(T_, big){ const b = T_.tm && typeof teamBadge==='function' ? teamBadge(T_.tm) : '';
  const nm = T_.tm ? `<a href="javascript:void 0" data-act="tteam" data-v="${T_.tm.id}">${esc(T_.name)}</a>` : esc(T_.name);
  return `<div class="gsth ${T_.won?'win':'loss'}">${b}<span class="gsthn">${nm}</span><span class="gstag">${T_.won?'Victory':'Defeat'}</span></div>`; }
function gsUnits(s, n){ return Object.entries(s.units||{}).filter(([k])=>k!=='Villager').sort((a,b)=>b[1]-a[1]).slice(0,n); }
function gsMore(p){ const s = p.stats||{}, u = Object.entries(s.units||{}).sort((a,b)=>b[1]-a[1]), sp = s.spent||{}, tot = Object.values(sp).reduce((a,b)=>a+b,0);
  const bar = tot ? `<div class="gsspent">${[['economy','Eco'],['military','Military'],['techs','Techs'],['buildings','Buildings']].map(([k,n])=>sp[k]?`<span class="sp-${k}" style="flex:${sp[k]}" title="${n} ${sp[k]}">${Math.round(sp[k]/tot*100)>=9?n:''}</span>`:'').join('')}</div>` : '';
  return `${bar}<div class="small"><b>Units queued:</b> ${u.map(([k,v])=>`${esc(k)} ${v}`).join(', ')||'–'}</div>
    <div class="small" style="margin-top:4px"><b>Build order:</b> ${(s.build||[]).slice(0,25).map(b=>`${esc(b[0])} ${esc(b[1])}`).join(' · ')||'–'}</div>
    ${(s.eco||[]).length?`<div class="small" style="margin-top:4px"><b>Eco upgrades:</b> ${s.eco.map(b=>`${esc(b[0])} ${esc(b[1])}`).join(' · ')}</div>`:''}`; }
const gsIdle = s => s && s.tcIdle && ('dark' in s.tcIdle || 'feudal' in s.tcIdle) ? (s.tcIdle.dark||0) + (s.tcIdle.feudal||0) : null;

/* A: scoreboard. One table per team, winners first, colour bar on each row, click a row for units and build order */
function gsLookA(g, TT){
  const row = p => { const s = p.stats||{}, a = s.ages||{}, k = 'gs'+p.profileId;
    return `<tr class="gsrow" style="--pc:${PCOL[p.color]||'#888'}" data-gs="${k}"><td class="gsc"></td><td>${gsName(p)}</td><td>${esc(p.civ||'')}</td><td class="n">${s.eapm??''}</td><td class="n">${s.apm??''}</td><td class="gsop">${gsOpen(s)}</td>
      <td class="n">${esc(a.Feudal||'')}</td><td class="n">${esc(a.Castle||'')}</td><td class="n">${esc(a.Imperial||'')}</td><td class="n">${s.military??''}</td><td class="n">${gsMs(gsIdle(s))}</td><td class="gsx">▾</td></tr>

    + `<div class="small muted">Click a player's row for units, spending and build order. Age times are when the player clicked up.</div>`; }

/* B: player cards. Team columns side by side, a card per player with age-up timeline, top units and spending */
function gsLookB(g, TT){
  const len = gsSec(g.gameTime) || 1;

    const mk = (n,l) => { const v = gsSec(a[n]); return v==null ? '' : `<span class="gsmk" style="left:${Math.min(100,v/len*100)}%" title="${n} click ${a[n]}"><b>${l}</b></span>`; };
    return `<div class="gscard" style="--pc:${PCOL[p.color]||'#888'}"><div class="gscardh">${gsName(p)}<span class="muted small">${esc(p.civ||'')}</span></div>

      <div class="gsline">${mk('Feudal','F')}${mk('Castle','C')}${mk('Imperial','I')}</div>
      <div class="small gsop2">${gsOpen(s)}</div>

      ${tot?`<div class="gsspent sm">${['economy','military','techs','buildings'].map(k=>sp[k]?`<span class="sp-${k}" style="flex:${sp[k]}" title="${k} ${sp[k]}"></span>`:'').join('')}</div>`:''}
      <details class="gsdd"><summary class="small">Build order</summary>${gsMore(p)}</details></div>`; };
  return `<div class="gscols">${TT.map(T_=>`<div class="gsteam ${T_.won?'win':'loss'}">${gsTeamHead(T_)}<div class="gscards">${T_.ps.map(card).join('')}</div></div>`).join('')}</div>
    <div class="small muted">Spending bar: <span class="sp-key sp-economy"></span>eco <span class="sp-key sp-military"></span>military <span class="sp-key sp-techs"></span>techs <span class="sp-key sp-buildings"></span>buildings.</div>`; }

/* C: timeline. Age-up lanes and an eAPM chart over the game, each player in their colour, then a compact table */
function gsLookC(g, TT){
  const len = gsSec(g.gameTime) || 1, nar = window.innerWidth < 700, W = nar ? 440 : 900, L = nar ? 100 : 170, ps = TT.flatMap(T_=>T_.ps), lh = 26, x = v => L + v/len*(W-L-10);
  const ticks = []; for(let m=0;m*60<=len;m+= (len>2400||nar)?10:5) ticks.push(m);
  let lanes = ''; ps.forEach((p,i)=>{ const s = p.stats||{}, a = s.ages||{}, y = 22 + i*lh, c = PCOL[p.color]||'#888';

/* one replay's stats as stored (cached); gsLoad gives what the views show: a restored game joined from all its parts */

/* ---------- Admin results: an organiser awards a map (adm 1) or the rest of a set (adm 2) without a replay, with an optional note ----------

/* the action handlers (called from act) */
function admAward(S, m, v, whole, note){

  for(let i=0; i<Math.max(bo, m.games.length) && !done(); i++){ const g = m.games[i]; if(g && (g.w===0||g.w===1)) continue; put(i); if(!whole) break; }

/* ---------- Fixtures as compact bracket boxes (seed · logo · name · score), click a box for games / editing ---------- */

const tsec = v => { const m = /^(?:(\d+):)?(\d+):(\d\d)$/.exec(String(v||'').trim()); return m ? (+(m[1]||0))*3600 + +m[2]*60 + +m[3] : null; };
const mmss = s => s==null || isNaN(s) ? '–' : (s = Math.round(s), s>=3600 ? Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0') : Math.floor(s/60)) + ':' + String(Math.round(s%60)).padStart(2,'0');
/* every decided map of the tournament, with who actually played it on each side */
function mapGames(t){ const out = [];
  allMatches(t).forEach(({S,m})=>{ const sd = sidesOf(S,m,t); if(!sd[0]||!sd[1]||!sd[0].length||!sd[1].length) return;
    (m.games||[]).forEach((g,gi)=>{ if(!g || (g.w!==0&&g.w!==1) || g.adm) return; const civs = g.civs||{}, any = Object.values(civs).some(Boolean);

      (g.fill||[]).forEach(f=>{ if(f.id && state.players[f.id] && (f.s===0||f.s===1) && !on[f.s].includes(f.id)) on[f.s].push(f.id); });   // fill-ins count for themselves

/* ---------- Match predictions ----------
   Every player starts at their ranked ELO (the event's ladder, else 1v1; players with none start at the median).
   Each map played in this tournament then moves the ratings of the players who played it, Elo style (K = PK),
   so the tournament's own results count for more as it goes on. A side's rating is the average of its players
   (for a team match not yet played: the whole roster). When a game's map is known, each side's record on that

const PK = 40, PMAP = 160;
const pOdds = (a, b) => 1 / (1 + Math.pow(10, (b - a) / 400));

  ids.forEach(id=>{ const e = eloOf(id,lad) || eloOf(id,'rm1'); if(e) r[id] = +e.r; });
  const known = Object.values(r).sort((a,b)=>a-b), med = known.length ? known[known.length>>1] : 1000;

}

  });

    if(!c) return `<div class="sxrec none"><span class="lbl">${title}</span><b>–</b><i>no games yet</i></div>`; const x = c.r.x, live_ = typeof LIVE!=='undefined' && LIVE && x.g.mid;
    return `<div class="sxrec" ${live_?`data-act="gstats" data-mid="${esc(x.g.mid)}" title="Open game stats"`:''}><span class="lbl">${title}</span>${live_?`<button class="sxrecv" data-act="gstats" data-mid="${esc(x.g.mid)}" aria-label="${esc(title)} ${esc(String(fmt(c.v)))}, open game stats">${fmt(c.v)}</button>`:`<b>${fmt(c.v)}</b>`}<div>${pl(c.r.id)}</div><i>${esc(x.g.map||'')} · ${sideNameH(x.sd[0])} v ${sideNameH(x.sd[1])}</i></div>`; };
  const recCards = `<div class="sxrecs">${[recCard('Fastest Feudal', s=>tsec(s.feudal), 1, mmss), recCard('Fastest Castle', s=>tsec(s.castle), 1, mmss), recCard('Fastest Imperial', s=>tsec(s.imp), 1, mmss),
    recCard('Highest game eAPM', s=>s.eapm, 0, v=>Math.round(v)), recCard('Busiest minute', s=>s.peak, 0, v=>Math.round(v))].join('')}</div>`;
  const cmx = Math.max(1,...civs.map(c=>c[1].n)), mmx = Math.max(1,...maps.map(m=>m[1].n));
  const civBars = `<div class="card"><h3>Civs</h3><div class="small muted">Bar length = picks, colour = win rate (green wins more, red loses more).</div>${civs.length?`<div class="sxbars"><div class="sxbr sxbh"><span></span><span></span><span class="c">Picks</span><span class="c">Win %</span></div>${civs.map(([c,e])=>{ const by = Object.entries(e.by).sort((a,b)=>b[1]-a[1])[0], wr = e.w/e.n;
      return `<div class="sxbr" title="${esc(c)}: ${e.w}–${e.n-e.w}${by&&state.players[by[0]]?', most by '+esc(P(by[0]).name):''}"><span class="nm">${esc(c)}</span><span class="track"><span style="width:${(e.n/cmx*100).toFixed(0)}%;background:color-mix(in srgb,var(--win-bg) ${Math.round(wr*100)}%,var(--loss))"></span></span><span class="c">${e.n}</span><span class="c">${pct(e.w,e.n)}</span></div>`; }).join('')}</div>`:'<div class="muted small sxnone">No games yet.</div>'}</div>`;
  const mapBars = `<div class="card"><h3>Maps</h3><div class="small muted">Games played and average length.</div>${maps.length?`<div class="sxbars"><div class="sxbr sxbh"><span></span><span></span><span class="c">Games</span><span class="c">Avg length</span></div>${maps.map(([k,e])=>`<div class="sxbr" title="${esc(k)}: shortest ${e.len.length?mmss(Math.min(...e.len)):'–'}, longest ${e.len.length?mmss(Math.max(...e.len)):'–'}"><span class="nm">${esc(k)}</span><span class="track"><span style="width:${(e.n/mmx*100).toFixed(0)}%"></span></span><span class="c">${e.n}</span><span class="c">${e.len.length?mmss(avgOf(e.len)):'–'}</span></div>`).join('')}</div>`:'<div class="muted small sxnone">No games yet.</div>'}</div>`;
  /* heatmap: each replay column tinted by how the player ranks against the field */
  const LOW = {feudal:1, castle:1, imp:1, idleC:1, flt:1}, rngs = {}; pcols.forEach(i=>{ const k = MET[i].k, v = prow.map(p=>p.o[k]).filter(numOk).map(Number); rngs[k] = v.length>1 ? [Math.min(...v), Math.max(...v)] : null; });
  const heat = (k, v) => { const R = rngs[k]; if(!R || !numOk(v) || R[1]===R[0] || k==='ecoPct' || k==='milPct') return ''; let f = (v-R[0])/(R[1]-R[0]); if(LOW[k]) f = 1-f;
    return ` style="background:color-mix(in srgb,${f>=.5?'var(--win-bg)':'var(--loss)'} ${Math.round(Math.abs(f-.5)*2*50)}%,transparent)"`; };
  return `${none?`<div class="note statsnote" role="status"><b>No games played yet${sd?' in '+esc(sd):''}.</b> These stats fill in automatically as games are played and confirmed.</div>`:''}${seg}
    <h2 class="sech">${scope}</h2>${hero}
    <h2 class="sech">Leaders</h2><div class="small muted" style="margin:-6px 0 10px">From each player's averages${minN>1?' (2 or more games with a replay)':''}. Click a name for their page.</div><div class="sxgrid3">${boards}</div>
    <h2 class="sech">Single-game records</h2><div class="small muted" style="margin:-6px 0 10px">Click a record to open that game's stats.</div>${recCards}
    <h2 class="sech">Civs and maps</h2><div class="grid g2">${civBars}${mapBars}</div>
    <h2 class="sech">Replay averages</h2><div class="small muted" style="margin:-6px 0 10px">Average of every player in every game with a replay${o.n?` (${o.n} player-games)`:''}. Float is an estimate from the replay.</div><div class="statrow">${sxRepTiles(o)}</div>
    ${divRows?`<div class="card"><h3>Divisions</h3><div class="tablewrap"><table><tr><th>Division</th><th class="n">Maps</th><th class="n">Avg eAPM</th><th class="n">Feudal</th><th class="n">Castle</th><th class="n">TC idle to Castle</th><th class="n">Float</th><th class="n">Avg game</th></tr>${divRows}</table></div></div>`:''}
    ${t.teams.length?`<div class="card"><h3>Teams</h3><div class="small muted">Click a team for its page.</div><div class="tablewrap"><table><tr><th>Team</th><th class="n">Maps W–L</th><th class="n">eAPM</th><th class="n">Feudal</th><th class="n">Castle</th><th class="n">TC idle to Castle</th><th class="n">Float</th><th class="n">Mil focus</th><th class="n">Avg game</th><th>Most used civ</th><th>Best civ</th></tr>${teamRows}</table></div></div>`:''}
    ${sxOpenCards(recs)}
    <h2 class="sech">Players</h2><div class="card"><div class="small muted">Click a player for their full stats. Green = better than the field, red = worse. ${ec.length?esc(eloNote()):''}</div><div class="tablewrap"><table><tr><th>Player</th>${ec.map(k=>`<th class="n">${LADDER[k]}</th>`).join('')}<th class="n">Maps W–L</th><th class="n">Win %</th>${pcols.map(i=>`<th class="n">${MET[i].n}</th>`).join('')}<th>Usual opening</th></tr>
      ${prow.map(p=>`<tr style="cursor:pointer" data-act="tplayer" data-v="${p.id}"><td>${chip('p:'+p.id,t)}</td>${ec.map(k=>`<td class="n">${eloTxt(p.id,k)}</td>`).join('')}<td class="n">${p.w}–${p.n-p.w}</td><td class="n">${pct(p.w,p.n)}</td>${pcols.map(i=>`<td class="n"${heat(MET[i].k,p.o[MET[i].k])}>${sxVal(p.o,MET[i])}</td>`).join('')}<td class="small">${esc(p.o.opening||'–')}</td></tr>`).join('')}</table></div></div>`;
}

/* ---------- Seeding: order entrants by hand (▲▼) or by ranked ELO (saved by the game finder) ----------
   Knockout stages "By hand" store the order in S.manualSeeds. Swiss stages store it in S.entrants and can pair
   round 1 by seed (S.r1 = 'seed': 1 v N/2+1, 2 v N/2+2, ...) instead of at random. */
const seedable = S => (S.type==='elim' && S.seedFrom==='manual') || S.type==='swiss';
function seedOrder(S, t){ return S.type==='elim' ? seedSource(S,t) : stageEntrants(S,t); }
function seedSet(S, t, order){ if(S.type==='elim') S.manualSeeds = order; else S.entrants = order.concat((S.entrants||[]).filter(k=>!order.includes(k) && !stageEntrants(S,t).includes(k))); }
function entElo(k, t){ const lad = modeOf(t), ids = entMembers(k,t);
  const v = ids.map(id=>{ const e = eloOf(id, k.startsWith('t:') ? lad : 'rm1') || eloOf(id, lad) || eloOf(id, 'rm1'); return e ? +e.r : null; }).filter(x=>x!=null);
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; }
function seedTools(S, t){ if(!seedable(S)) return '';
  const any = seedOrder(S,t).some(k=>entElo(k,t)!=null);
  return ` Order = seeding (use ▲▼).</div><div class="row" style="margin:6px 0;align-items:center"><button class="sm" data-act="seedelo" data-s="${S.id}" ${any?'':'disabled'}>Seed by ranked ELO</button>`
    + `<span class="small muted">${any ? (S.ent==='teams'?'Teams by their players\' average ELO. ':'')+'You can still move anyone after.' : 'No ranked ELOs yet. The game finder fetches them on its next run (every 10 minutes), then this button works.'}</span>`
    + (S.type==='swiss' ? `<label class="small" style="margin-left:auto">Round 1 pairs <select data-act="swr1" data-s="${S.id}"><option value="rand" ${S.r1!=='seed'?'selected':''}>at random</option><option value="seed" ${S.r1==='seed'?'selected':''}>by seed (top half v bottom half)</option></select></label>` : ''); }
function seedRow(S, k, j){ return seedable(S) ? `<button class="sm" data-act="seedup" data-s="${S.id}" data-v="${k}" title="Move up">▲</button><button class="sm" data-act="seeddn" data-s="${S.id}" data-v="${k}" title="Move down">▼</button><span class="small muted">seed ${j+1}${(()=>{ const e = entElo(k,T()); return e!=null?' · '+Math.round(e):''; })()}</span>` : ''; }
/* ---------- click any table header to sort: numbers high→low first, words A→Z first; click again to flip ---------- */
const tsort = {};
function tKey(tb){ const box = tb.closest('.card,details,.box,section') || document.body, h = box.querySelector('h2,h3,summary');
  return (ui.tab||'') + '|' + (ui.sdiv||'') + '|' + (h ? h.textContent.trim().slice(0,40) : '') + '|' + [...box.querySelectorAll('table')].indexOf(tb); }
function tHead(tb){ return [...tb.rows].find(r=>r.querySelector('th')); }
function tVal(td){ if(!td) return null; const t = (td.dataset.sv ?? td.textContent).trim(); if(!t || /^[–—-]$/.test(t)) return null;
  const m = /^(\d+):(\d\d)(?::(\d\d))?$/.exec(t); if(m) return m[3]!=null ? +m[1]*3600 + +m[2]*60 + +m[3] : +m[1]*60 + +m[2];
  if(/^[-+−]?[\d.,]+\s*%?$/.test(t)) return parseFloat(t.replace(/[,%\s]/g,'').replace('−','-'));
  const w = /^(\d+)\s*[–-]\s*(\d+)$/.exec(t); if(w) return +w[1] - +w[2] + +w[1]/1000;     // records like 3–1 sort by wins minus losses
  return t.toLowerCase(); }
function tSortable(tb){ return tb.closest('.tour') && ui.tab!=='setup' && ui.tab!=='data' && !tb.querySelector('input,select,textarea') && tHead(tb) && tb.rows.length > 2; }
function tApply(tb){ const hr = tHead(tb), s = tsort[tb.dataset.tk];
  [...hr.cells].forEach((th,i)=>{ th.classList.add('sortable'); th.classList.toggle('sa', !!s && s.c===i && s.d>0); th.classList.toggle('sd', !!s && s.c===i && s.d<0);
    if(!th.title) th.title = 'Sort'; th.tabIndex = 0;
    if(!th.textContent.trim()) th.innerHTML = `<span class="sr">${i===0 ? 'Rank' : 'Name'}</span>`;
    th.setAttribute('aria-sort', s && s.c===i ? (s.d>0 ? 'ascending' : 'descending') : 'none'); });
  if(!s) return;
  const rows = [...tb.rows].filter(r=>r.rowIndex > hr.rowIndex && !r.classList.contains('nosort')), body = rows[0] && rows[0].parentNode; if(!body) return;
  rows.map((r,i)=>({r, i, v:tVal(r.cells[s.c])})).sort((a,b)=>{ if(a.v==null && b.v==null) return a.i-b.i; if(a.v==null) return 1; if(b.v==null) return -1;
      const c = typeof a.v==='number' && typeof b.v==='number' ? a.v-b.v : typeof a.v==='number' ? -1 : typeof b.v==='number' ? 1 : String(a.v).localeCompare(String(b.v));
      return c*s.d || a.i-b.i; }).forEach(x=>body.appendChild(x.r)); }
function tScan(){ document.querySelectorAll('.tour table').forEach(tb=>{ if(tb.dataset.tk || !tSortable(tb)) return; tb.dataset.tk = tKey(tb); tApply(tb); }); }
new MutationObserver(tScan).observe(document.documentElement, {childList:true, subtree:true});
document.addEventListener('click', e=>{ const th = e.target.closest('th.sortable'); if(!th || e.target.closest('button,a,[data-act]')) return;
  const tb = th.closest('table'), k = tb.dataset.tk, i = th.cellIndex, cur = tsort[k];
  if(cur && cur.c===i) cur.d = -cur.d; else { const v = [...tb.rows].slice(tHead(tb).rowIndex+1).map(r=>tVal(r.cells[i])).find(x=>x!=null); tsort[k] = {c:i, d: typeof v==='number' ? -1 : 1}; }
  tApply(tb); });
/* ---------- keyboard access: rows that open a player or team get a focusable name; Enter/Space work on custom buttons, links and sort headers ---------- */
function a11yScan(){ document.querySelectorAll('tr[data-act][data-v]').forEach(tr=>{ if(tr.dataset.ax || !tr.dataset.v) return; tr.dataset.ax = '1';
    const c = tr.cells[0]; if(!c || c.querySelector('a[href],button,input,select,[tabindex]')) return; const n = c.querySelector('.chip') || c;
    n.tabIndex = 0; n.setAttribute('role','link'); if(tr.title) n.setAttribute('aria-label', tr.title); n.classList.add('axl'); });
  document.querySelectorAll('tr[data-act][data-mid]').forEach(tr=>{ if(tr.dataset.ax) return; tr.dataset.ax = '1'; const c = tr.cells[0]; if(!c || c.querySelector('a[href],button,input,select,[tabindex]')) return;
    c.tabIndex = 0; c.setAttribute('role','button'); c.setAttribute('aria-label', (tr.title||'Open') + ': ' + c.textContent.trim()); c.classList.add('axl'); }); }
new MutationObserver(a11yScan).observe(document.documentElement, {childList:true, subtree:true});
document.addEventListener('keydown', e=>{ if(e.key!=='Enter' && e.key!==' ') return; const el = e.target;
  if(!el || !el.matches || el.matches('a[href],button,input,select,textarea,summary')) return;
  if(el.matches('[role=button],[role=link],th.sortable')){ if(e.key===' ' && el.getAttribute('role')==='link') return; e.preventDefault(); el.click(); } });

/* ============ boot ============ */
document.addEventListener('click', e=>{ const el = e.target.closest('[data-act]'); if(!el || el.tagName==='SELECT' || (el.tagName==='INPUT' && el.type!=='button')) return; act(el, e); });
document.addEventListener('change', e=>{ const el = e.target; if(el.dataset.act && (el.tagName==='SELECT'||el.tagName==='INPUT')){ act(el, e); return; } onField(el, true); });
document.addEventListener('keydown', e=>{ const el = e.target; if(e.key==='Enter' && el.dataset && el.dataset.mapin){ e.preventDefault(); const b = document.querySelector(`button[data-act="mapadd"][data-s="${el.dataset.mapin}"]`); if(b) act(b,e); } });
document.addEventListener('input', e=>{ const el = e.target; if(el.dataset.act) return; if(el.type==='text'||el.type==='url'||el.tagName==='TEXTAREA') onField(el, false); });
(async function boot(){
  if(LIVE){ try{ db = await idb(); }catch(e){ db = null; } $('#root').innerHTML = '<div class="wrap"><p class="muted">Loading…</p></div>'; liveBoot(); return; }
  if(VIEW){ state = window.TT_VIEW; }
  else { state = await load(); if(!validState(state)) state = blankState(); }
  if(!state.cur && state.tours[0]) state.cur = state.tours[0].id;
  render();
})();
</script>
