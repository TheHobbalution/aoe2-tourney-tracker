name: Detect games
# Looks for new tournament games and puts them in the tracker's Confirm games queue.
# Times are UTC, set for Sydney summer time (AEDT, UTC+11). When AEST (UTC+10) starts in April, add 1 to every hour.
# Sydney: 6am daily; every 30 min 5pm-midnight weekdays; every 30 min 10am-midnight weekends.
# GitHub may run it a few minutes late when busy. Run it by hand from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: "0 19 * * *"          # 6am daily
    - cron: "*/30 6-12 * * 1-5"   # weekdays 5pm-midnight
    - cron: "*/30 23 * * 5,6"     # Sat/Sun 10-11am
    - cron: "*/30 0-12 * * 0,6"   # Sat/Sun 11am-midnight
  workflow_dispatch:
concurrency:
  group: detect
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: detector/requirements.txt
      - run: pip install -r detector/requirements.txt
      - run: python detector/detect.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
